# CDXC:AgentHistorySearch 2026-08-20:
# zehn was a pinned Zig submodule that had to be built with a separate Zig
# toolchain and bundled as its own binary. This crate is the full Rust port of
# it: the same scanners, the same fuzzy matcher, the same TUI, and the same
# favorites file. Ghostex links it directly, so `gx f` and the Find surface both
# run in-process and no Zig toolchain or extra bundled executable is required.
[package]
name = "zehn"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "zehn"
path = "src/lib.rs"

[[bin]]
name = "zehn"
path = "src/bin/zehn.rs"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
