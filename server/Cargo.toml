[package]
name = "gxserver"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
crossterm = "0.29"
# CDXC:StateSync 2026-11-12 WHY: deflate for the phone's link (server/src/server/link_compression.rs); already in the graph through zip, so a direct-dependency promotion, not a new download.
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
ghostex-paths = { path = "../packages/paths" }
ghostex-spaceo-heal = { path = "../packages/spaceo-heal" }
ghostex-gx-protocol = { path = "../packages/gx-protocol" }
ghostex-gx-cloud = { path = "../packages/gx-cloud" }
ghostex-docs = { path = "../packages/project-docs" }
ghostex-find = { path = "../packages/find" }
ghostex-settings-catalog = { path = "../packages/settings-catalog" }
# CDXC:SettingsSync 2026-11-06 SEE-ALSO:
# Settings sync's merge rules and the Spaces mapping (`settings_sync`), shared with the phone, and
# the one list's repository identity (`unified_sidebar::repo`) that files a repository alike on every computer.
ghostex-gx-core = { path = "../packages/gx-core" }
# CDXC:FilesAndLinks 2026-10-12 SEE-ALSO:
# The chat core's own rules for what a message mentions (`transcript/files_links.rs`), which
# `readSessionFilesLinks` runs over every transcript so the list and the transcript agree.
ghostex-gx-chat-core = { path = "../packages/gx-chat-core" }
# CDXC:SessionChat 2026-10-06 SEE-ALSO:
# `ghostex visual check` draws a chat ```visual block with the same layout crate the chat
# clients use, and paints it to a PNG with resvg (the renderer the desktop's diagrams use).
ghostex-gx-visual = { path = "../packages/gx-visual" }
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# CDXC:WorkMode 2026-10-28 WHY:
# A command ticket source's SVG icon is parsed with the XML reader resvg already compiles in and
# rebuilt from an allowlist (work_mode/command/icon.rs). Keep it at usvg's version.
roxmltree = "0.21.2"
# PNG encoding for the check's picture (tiny-skia's `png-format`, on by default).
tiny-skia = "0.11"
ghostex-agent-sync = { path = "../packages/agent-sync" }
# The live subscription to a Work workspace's team Convex project (crate::team_sync). rustls, not the
# default vendored OpenSSL, so it reuses the TLS stack the server already ships.
convex = { version = "0.10.4", default-features = false, features = ["rustls-tls-webpki-roots"] }
# The voice agent's provider sockets (xAI Grok Voice, OpenAI Realtime, xAI speech-to-text): the same
# tokio-tungstenite build axum's WebSocket support compiles in (0.29; convex pins 0.28) and convex's
# rustls stack, so no new socket or TLS code ships. `tungstenite` below is that same 0.29 build.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
libc = "0.2"
markdown = "1"
md-5 = "0.11"
percent-encoding = "2"
portable-pty = "0.9"
rand = "0.10"
# Verifies approvers' signatures (P-256 from the Secure Enclave / Android Keystore, RSA from Windows Hello); already in the tree through rustls.
ring = "0.17"
# CDXC:Security 2026-11-16 WHY: `ghostex computer-code` asks Touch ID, Windows Hello or the system (polkit) password before it approves a device with y, when Settings > Security > "Require Touch ID or your password to approve" is on: the same presence prompt the app uses (packages/owner-keys). Only its `confirm_presence` is called here; the key store code comes with it.
ghostex-owner-keys = { path = "../packages/owner-keys" }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
ureq = { version = "3.5", features = ["json"] }
# `fallible_uint`: rusqlite 0.38 moved the u64 column reads and writes (session counts, the scan cache) behind it.
# CDXC:Deps 2026-11-21 DECISION: SQLite is compiled in (`bundled`) on every platform, macOS included. This replaces the CDXC:Release 2026-10-23 decision to link macOS's own /usr/lib/libsqlite3.dylib, which saved about 1.2 MB of DMG. rusqlite 0.41 and later (the fix for RUSTSEC-2026-0459, a SQLite page-cache bug) call `sqlite3_set_clientdata`, which needs SQLite 3.44, newer than any SQLite macOS ships (3.39 on macOS 13, 3.43.2 on macOS 15, checked in the 24A335 dyld shared cache). The user chose a compiled-in SQLite over staying on the vulnerable rusqlite 0.40. User 2026-11-22 (Q4463): ship the SQLite fix but keep macOS 14, so the macOS minimum does not change with it; a compiled-in SQLite needs no newer macOS.
# SEE-ALSO: apps/desktop/Cargo.toml, packages/find/Cargo.toml, packages/project-docs/Cargo.toml, packages/client-storage-native/Cargo.toml.
rusqlite = { version = "0.43", features = ["fallible_uint", "hooks", "bundled"] }
# Codex compresses week-old rollouts to `.jsonl.zst` (crate::codex_rollout_archive); decode only, pure Rust.
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha1 = "0.11"
sha2 = "0.11"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = "0.25"
tower = "0.5"
unicode-width = "0.2"
url = "2"
vt100 = "0.18"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
# CDXC:Automations 2026-11-08 WHY:
# A daily, weekly or cron automation runs at its wall time in the schedule's own zone (`local` or an IANA name the desktop writes), so gxserver reads the system tz database through jiff to resolve the zone and its DST gaps and folds (automations/schedule_zone.rs). chrono alone knows only UTC and this computer's zone.
jiff = "0.2.38"

[target.'cfg(windows)'.dependencies]
ghostex-editor-client = { path = "../packages/editor-client" }
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Diagnostics_Debug",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
] }
