[package]
name = "ghostex-push-relay"
version = "0.2.0"
edition = "2021"
description = "Ghostex's push relay: holds the Apple push key and sends Live Activity, notification and widget pushes for the Ghostex iPhone app, nothing else, and briefly holds an update token mailbox and a widget snapshot store in memory."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ghostex-push-relay"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23"
hex = "0.4"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
webpki-roots = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
