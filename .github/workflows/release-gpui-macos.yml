name: GPUI release - macOS arm64

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      runtime_artifacts_ready:
        required: true
        type: boolean
      update_sparkle:
        required: false
        default: true
        type: boolean
    secrets:
      APPLE_DEVELOPER_ID_P12_BASE64:
        required: true
      APPLE_DEVELOPER_ID_P12_PASSWORD:
        required: true
      APPLE_KEYCHAIN_PASSWORD:
        required: true
      APPLE_NOTARY_KEY_BASE64:
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false
      APPLE_NOTARY_APPLE_ID:
        required: false
      APPLE_NOTARY_TEAM_ID:
        required: false
      APPLE_NOTARY_APP_PASSWORD:
        required: false
      SPARKLE_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: steveyegge/beads
          ref: 672d942083a1fd0c8603fa1e77620c58ba9d47c8
          fetch-depth: 1
          path: build/pinned-beads-source
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-go@v6
        with:
          go-version-file: build/pinned-beads-source/go.mod
          cache-dependency-path: build/pinned-beads-source/go.sum
      - name: Restore embedded source checkouts
        run: |
          git submodule update --init --depth=1 -- code-server
          git -C code-server submodule update --init --depth=1 -- lib/vscode
      - name: Resolve immutable code-server component identity
        id: code_server_identity
        run: node scripts/release-gpui/code-server-component-identity.mjs --root code-server --platform linux-x64 --github-output >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code-server/package-lock.json
      - uses: actions/download-artifact@v8
        if: ${{ inputs.runtime_artifacts_ready }}
        with:
          name: release-gxserver-linux-x64
          path: build/runtime-artifacts/x64
      - uses: actions/download-artifact@v8
        if: ${{ inputs.runtime_artifacts_ready }}
        with:
          name: release-gxserver-linux-arm64
          path: build/runtime-artifacts/arm64
      - uses: actions/download-artifact@v8
        if: ${{ inputs.runtime_artifacts_ready }}
        with:
          name: ${{ steps.code_server_identity.outputs.artifact_name }}
          path: build/runtime-artifacts/code-server-x64
      - uses: actions/download-artifact@v8
        if: ${{ inputs.runtime_artifacts_ready }}
        with:
          name: release-code-server-${{ steps.code_server_identity.outputs.component_version }}-linux-arm64
          path: build/runtime-artifacts/code-server-arm64
      - name: Validate required remote runtime archives
        run: |
          for archive in \
            build/runtime-artifacts/x64/gxserver-linux-x64.tar.gz \
            build/runtime-artifacts/arm64/gxserver-linux-arm64.tar.gz \
            build/runtime-artifacts/code-server-x64/${{ steps.code_server_identity.outputs.archive_name }} \
            build/runtime-artifacts/code-server-arm64/code-server-${{ steps.code_server_identity.outputs.component_version }}-linux-arm64.tar.gz; do
            [[ -f "$archive" ]] || { echo "Missing required macOS release archive: $archive" >&2; exit 1; }
            tar -tzf "$archive" >/dev/null
          done
          for tuple in \
            "x64 build/runtime-artifacts/code-server-x64/${{ steps.code_server_identity.outputs.archive_name }}" \
            "arm64 build/runtime-artifacts/code-server-arm64/code-server-${{ steps.code_server_identity.outputs.component_version }}-linux-arm64.tar.gz"; do
            set -- $tuple
            node scripts/release-gpui/verify-code-server-archive.mjs \
              --archive "$2" \
              --version "${{ steps.code_server_identity.outputs.component_version }}" \
              --platform "linux-$1"
          done
      - name: Restore remote runtime packages
        if: ${{ inputs.runtime_artifacts_ready }}
        run: |
          mkdir -p build/remote-gxserver-linux/x64/package build/remote-gxserver-linux/arm64/package
          tar -xzf build/runtime-artifacts/x64/gxserver-linux-x64.tar.gz -C build/remote-gxserver-linux/x64/package
          tar -xzf build/runtime-artifacts/arm64/gxserver-linux-arm64.tar.gz -C build/remote-gxserver-linux/arm64/package
      - name: Install build tools
        run: brew install cmake ninja rsync xcodegen
      - name: Install pinned Zig toolchains
        run: |
          curl https://mise.run | sh
          "$HOME/.local/bin/mise" install zig@0.15.2 zig@0.16.0
          ZIG_015="$HOME/.local/share/mise/installs/zig/0.15.2/bin/zig"
          ZIG_016="$HOME/.local/share/mise/installs/zig/0.16.0/bin/zig"
          [[ "$($ZIG_015 version)" == "0.15.2" ]]
          [[ "$($ZIG_016 version)" == "0.16.0" ]]
          printf 'ZIG=%s\nGHOSTEX_ZIG=%s\nZEHN_ZIG=%s\n' \
            "$ZIG_015" "$ZIG_015" "$ZIG_016" >> "$GITHUB_ENV"
      - name: Seed pinned VS Code ripgrep cache
        env:
          RIPGREP_PACKAGE_VERSION: 1.17.1
          RIPGREP_VERSION: v15.0.1
          RIPGREP_SHA256: 2fa16464fd8638588a67c7fc172d3c4b57fbdc65dff366e10b0b0e90734628a6
        run: |
          RIPGREP_ASSET="ripgrep-${RIPGREP_VERSION}-aarch64-apple-darwin.tar.gz"
          RIPGREP_CACHE_DIR="$(node -p 'require("os").tmpdir()')/vscode-ripgrep-cache-${RIPGREP_PACKAGE_VERSION}"
          RIPGREP_CACHE_PATH="${RIPGREP_CACHE_DIR}/${RIPGREP_ASSET}"
          mkdir -p "$RIPGREP_CACHE_DIR"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/microsoft/ripgrep-prebuilt/releases/download/${RIPGREP_VERSION}/${RIPGREP_ASSET}" \
            --output "$RIPGREP_CACHE_PATH"
          [[ "$(shasum -a 256 "$RIPGREP_CACHE_PATH" | awk '{print $1}')" == "$RIPGREP_SHA256" ]]
          tar -tzf "$RIPGREP_CACHE_PATH" >/dev/null
      - name: Install JavaScript dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun install --frozen-lockfile
          npm --prefix code-server ci
      - name: Build pinned embedded-Dolt Beads
        run: |
          node scripts/build-pinned-beads-release.mjs \
            --source-root build/pinned-beads-source \
            --platform darwin \
            --arch arm64 \
            --output "$RUNNER_TEMP/ghostex-pinned-beads/bd"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - name: Validate Sparkle signing credential
        if: ${{ inputs.update_sparkle }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "SPARKLE_PRIVATE_KEY is required when update_sparkle is enabled" >&2
            exit 1
          fi
      # CDXC:T3CodeDisabled ghostex-mzp9: Retain this dependency setup for a
      # future re-enable; macOS packages intentionally omit T3 today.
      # - name: Install embedded T3 Code dependencies
      #   env:
      #     GITHUB_TOKEN: ${{ github.token }}
      #   run: |
      #     npm install --global pnpm@10.24.0
      #     pnpm --dir t3code install --frozen-lockfile
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ghostex-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: Configure App Store Connect notarization key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: |
          if [[ -n "$NOTARY_KEY_BASE64" && -n "$NOTARY_KEY_ID" && -n "$NOTARY_ISSUER_ID" ]]; then
            NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
            printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
            xcrun notarytool store-credentials notarytool-profile \
              --key "$NOTARY_KEY_PATH" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID"
          elif [[ -n "$NOTARY_APPLE_ID" && -n "$NOTARY_TEAM_ID" && -n "$NOTARY_APP_PASSWORD" ]]; then
            xcrun notarytool store-credentials notarytool-profile \
              --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" \
              --password "$NOTARY_APP_PASSWORD"
          else
            echo "Configure either App Store Connect API-key or Apple ID notarization secrets" >&2
            exit 1
          fi
      - name: Build, sign, notarize, and optionally generate appcast
        env:
          GH_TOKEN: ${{ github.token }}
          GHOSTEX_CODE_SIGN_IDENTITY: 'Developer ID Application: Mohamad Youssef (KTKP595G3B)'
          GHOSTEX_NOTARY_PROFILE: notarytool-profile
          GHOSTEX_BEADS_PREBUILT_BINARY: ${{ runner.temp }}/ghostex-pinned-beads/bd
          GHOSTEX_RELEASE_UPDATE_SPARKLE: ${{ inputs.update_sparkle && '1' || '0' }}
          GHOSTEX_ON_DEMAND_LINUX_X64_ARCHIVE: ${{ github.workspace }}/build/runtime-artifacts/x64/gxserver-linux-x64.tar.gz
          GHOSTEX_ON_DEMAND_LINUX_ARM64_ARCHIVE: ${{ github.workspace }}/build/runtime-artifacts/arm64/gxserver-linux-arm64.tar.gz
          GHOSTEX_CODE_SERVER_COMPONENT_VERSION: ${{ steps.code_server_identity.outputs.component_version }}
          GHOSTEX_ON_DEMAND_CODE_SERVER_LINUX_X64_ARCHIVE: ${{ github.workspace }}/build/runtime-artifacts/code-server-x64/${{ steps.code_server_identity.outputs.archive_name }}
          GHOSTEX_ON_DEMAND_CODE_SERVER_LINUX_ARM64_ARCHIVE: ${{ github.workspace }}/build/runtime-artifacts/code-server-arm64/code-server-${{ steps.code_server_identity.outputs.component_version }}-linux-arm64.tar.gz
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/release-gpui/macos.sh "${{ inputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: build/release-gpui/${{ inputs.version }}/macos-arm64/
          if-no-files-found: error
          retention-days: 14
