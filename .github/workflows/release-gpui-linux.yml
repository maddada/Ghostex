name: GPUI release - Linux packages

# CDXC:ReleaseChangeAwarePlanning 2026-08-13:
# One compile, three packages (§7); the AppImage (2026-10-26) is a fourth.
#
# DEB and RPM used to run as two independent jobs that each executed
# linux-stage.sh — a full `cargo build --release`, CEF download, and JS bundle —
# to produce two packages from what is byte-for-byte the same staged tree. That
# was ~13 minutes and one runner of pure duplication per release.
#
# The prefix-preserving `.tar.zst` (Arch, ubi, mise, and the AUR package) is the
# third wrapper over the same staged root and costs seconds, not a runner.
# The AppImage is a fourth: it copies opt/ghostex and the desktop entry out of
# the staged root into its own AppDir, so it never sees DEBIAN/ either way.
#
# Ordering matters: linux-rpm.sh and linux-tar.sh archive the whole package
# root, so both are built BEFORE linux-deb.sh creates DEBIAN/. Keep that order.
# Both archivers also delete DEBIAN/ defensively, so a future reordering
# degrades to a rebuilt archive rather than a leaked control directory.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      arch:
        description: Linux package architecture (x64 or arm64); each builds natively on its own runner
        required: false
        default: x64
        type: string
      packages:
        description: Comma-separated package formats to produce (any of deb, rpm, tar, appimage)
        required: true
        type: string
      runtime_artifacts_ready:
        required: false
        default: false
        type: boolean
      gxserver_source:
        description: run (await this run's gxserver artifact) or release (embed the live runtime of v<version>)
        required: false
        default: run
        type: string
      build_only:
        description: Upload Actions artifacts only; seal the CEF component without publishing it, attest nothing
        required: false
        default: false
        type: boolean
      plan:
        description: Resolved release plan JSON from the prepare job
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version
        required: true
        type: string
      packages:
        description: Linux package formats
        required: true
        default: deb,rpm,tar,appimage
        type: choice
        options: [deb, rpm, tar, appimage, 'deb,rpm', 'deb,rpm,tar', 'deb,rpm,tar,appimage']
      arch:
        description: Linux package architecture
        required: true
        default: x64
        type: choice
        options: [x64, arm64]

permissions:
  attestations: write
  contents: write
  id-token: write

# Ghostex's component signing key (tooling/release-gpui/component-signing.mjs): publish-component.mjs
# signs every component archive it records; GHOSTEX_REQUIRE_COMPONENT_SIGNATURES makes it, and the seal, refuse unsigned ones (#495).
env:
  GHOSTEX_COMPONENT_SIGNING_KEY: ${{ secrets.GHOSTEX_COMPONENT_SIGNING_KEY }}
  # The app's sealed on-demand-resources.json must carry every archive's signature.
  GHOSTEX_REQUIRE_COMPONENT_SIGNATURES: '1'

jobs:
  build:
    # CDXC:Release 2026-10-31 WHY:
    # Ubuntu 22.04, not 24.04: what this job links against sets the oldest glibc
    # the packages run on, and the AppImage now carries libraries copied from
    # this runner (appimage-bundle-libraries.mjs). Built on 24.04 the arm64 app
    # needed glibc 2.39 and 24.04's libxkbcommon needs 2.38, so neither ran on
    # the AppImage catalog's Ubuntu 22.04 test (PR #11084) or on Debian 12; from
    # 22.04 everything needs at most glibc 2.35. Going lower means a container
    # job (GitHub has no older Ubuntu runner), and Ubuntu 20.04's CMake 3.16 is
    # below the 3.21 the CEF wrapper needs.
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    timeout-minutes: 120
    env:
      CEF_PATH: ${{ github.workspace }}/apps/desktop/build/cef-cache
      GHOSTEX_LINUX_PACKAGE_ROOT: ${{ github.workspace }}/build/release-gpui/linux-package-root
      GHOSTEX_LINUX_PACKAGE_ROOT_READY: '1'
      GHOSTEX_RELEASE_PLAN: ${{ inputs.plan }}
      GHOSTEX_RELEASE_SOURCE_SHA: ${{ github.sha }}
      GHOSTEX_RELEASE_WORKFLOW_SHA: ${{ github.sha }}
      CARGO_INCREMENTAL: '0'
      KACHE_STORE_SET: linux-${{ inputs.arch }}-1
      GHOSTEX_RELEASE_BUILD_ONLY: ${{ inputs.build_only && '1' || '0' }}
      # Record the GBots component (release-gpui-gbots.yml) before sealing (tooling/gbots/seal-component.sh);
      # a build-only run ships without it when it is not published.
      GHOSTEX_GBOTS_SEAL: '1'
      GHOSTEX_GBOTS_OPTIONAL: ${{ inputs.build_only && '1' || '0' }}
      # And the Collab component (release-gpui-collab.yml, tooling/collab/seal-component.sh).
      GHOSTEX_COLLAB_SEAL: '1'
      GHOSTEX_COLLAB_OPTIONAL: ${{ inputs.build_only && '1' || '0' }}
      LINUX_ARCH: ${{ inputs.arch }}
      LINUX_DEB_ARCH: ${{ inputs.arch == 'arm64' && 'arm64' || 'amd64' }}
      LINUX_RPM_ARCH: ${{ inputs.arch == 'arm64' && 'aarch64' || 'x86_64' }}
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/build/zig-global-cache
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # kache (CDXC:ReleaseKache 2026-11-04, replacing sccache's GitHub Actions backend). The registry cache below
      # only stores crate *sources*; every `cargo build --release` on this
      # runner was a cold compile, ~50% of the 31-minute critical path on 8.5.0.
      # kache-action exports RUSTC_WRAPPER into GITHUB_ENV, so the wrapper
      # reaches every cargo invocation, including the one inside
      # build-linux-app.sh (via linux-stage.sh). Zig builds are not cargo and are
      # untouched. Pinned to one commit; the release preflight asserts every
      # release build workflow uses this same pin.
      # Component tags are published to a separate repository that
      # github.token cannot write; fail before any build work when the PAT is
      # missing (see tooling/release-gpui/components-repo-setup.md).
      - name: Require the components publishing token
        shell: bash
        env:
          COMPONENTS_GITHUB_TOKEN: ${{ secrets.COMPONENTS_GITHUB_TOKEN }}
        run: |
          if [[ -z "$COMPONENTS_GITHUB_TOKEN" ]]; then
            echo "::error::COMPONENTS_GITHUB_TOKEN is not configured; component tags are published to $(node tooling/release-gpui/components-repo.mjs) and github.token cannot write there. See tooling/release-gpui/components-repo-setup.md."
            exit 1
          fi
      # The kache store this job compiles through: the newest one warm-rust-build-cache.yml saved for this set.
      - name: Restore the kache store
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/kache
          key: kache-${{ env.KACHE_STORE_SET }}-${{ github.sha }}
          restore-keys: kache-${{ env.KACHE_STORE_SET }}-
      # kache-action v1 (pinned by commit): installs kache v2.0.0 and exports RUSTC_WRAPPER for every later step.
      - name: Install kache
        id: kache
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed
        with:
          version: v2.0.0
          cache-dir: ${{ runner.temp }}/kache
          github-cache: 'false'
          max-size: 1536MiB
          pr-comment: 'false'
      - name: Validate the requested architecture and gxserver source
        env:
          GXSERVER_SOURCE: ${{ inputs.gxserver_source || 'run' }}
        run: |
          case "$LINUX_ARCH" in
            x64) [[ "$(uname -m)" == "x86_64" ]] ;;
            arm64) [[ "$(uname -m)" == "aarch64" ]] ;;
            *) echo "arch must be x64 or arm64; got '$LINUX_ARCH'" >&2; exit 2 ;;
          esac
          case "$GXSERVER_SOURCE" in
            run | release) ;;
            *) echo "gxserver_source must be run or release; got '$GXSERVER_SOURCE'" >&2; exit 2 ;;
          esac
      - name: Validate the requested package formats
        env:
          REQUESTED_PACKAGES: ${{ inputs.packages }}
        run: |
          IFS=',' read -ra FORMATS <<<"$REQUESTED_PACKAGES"
          [[ ${#FORMATS[@]} -gt 0 ]] || { echo "packages must name at least one format" >&2; exit 2; }
          SEEN=""
          for FORMAT in "${FORMATS[@]}"; do
            case "$FORMAT" in
              deb | rpm | tar | appimage) ;;
              *) echo "packages entries must be deb, rpm, tar, or appimage; got '$FORMAT'" >&2; exit 2 ;;
            esac
            case " $SEEN " in
              *" $FORMAT "*) echo "packages repeats $FORMAT" >&2; exit 2 ;;
            esac
            SEEN="$SEEN $FORMAT"
          done
      - name: Resolve dependency cache keys
        id: cache_keys
        run: |
          {
            printf 'cef=%s\n' "$(git rev-parse HEAD:.dependencies/cef-rs)"
            printf 'zig=%s\n' "$(git rev-parse HEAD:.dependencies/ghostty)"
          } >> "$GITHUB_OUTPUT"
      - name: Restore Cargo registry cache
        uses: actions/cache@v6
        id: cargo_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-reg-linux-${{ hashFiles('apps/desktop/Cargo.lock', 'server/Cargo.lock') }}
          restore-keys: cargo-reg-linux-
      - name: Restore CEF distribution cache
        uses: actions/cache@v6
        id: cef_cache
        with:
          path: apps/desktop/build/cef-cache
          key: cef-linux-${{ env.LINUX_ARCH }}-${{ steps.cache_keys.outputs.cef }}
      - name: Restore Zig package cache
        uses: actions/cache@v6
        id: zig_cache
        with:
          path: |
            build/zig-global-cache
            ~/.cache/zig
          key: zig-linux-${{ env.LINUX_ARCH }}-${{ steps.cache_keys.outputs.zig }}
          restore-keys: zig-linux-${{ env.LINUX_ARCH }}-
      - name: Install native packaging dependencies
        run: |
          tooling/release-gpui/retry.sh 3 5 -- sudo apt-get update
          tooling/release-gpui/retry.sh 3 5 -- sudo apt-get install -y cmake ninja-build pkg-config rpm squashfs-tools zsync appstream zstd patchelf libasound2-dev libfontconfig1-dev libfreetype-dev libx11-dev libxcb1-dev libxkbcommon-x11-dev
      - name: Install pinned Zig toolchain
        run: |
          tooling/release-gpui/retry.sh 3 5 -- bash -c 'curl -fsSL https://mise.run | sh'
          tooling/release-gpui/retry.sh 3 5 -- "$HOME/.local/bin/mise" install zig@0.17.1
          ZIG_BIN="$HOME/.local/share/mise/installs/zig/0.17.1/bin/zig"
          [[ "$($ZIG_BIN version)" == "0.17.1" ]]
          printf 'ZIG=%s\nGHOSTEX_ZIG=%s\n' "$ZIG_BIN" "$ZIG_BIN" >> "$GITHUB_ENV"
      - name: Install JavaScript dependencies
        run: tooling/release-gpui/retry.sh 3 5 -- bun install --frozen-lockfile
      - name: Restore code-server source identity input
        run: git submodule update --init --depth=1 -- .dependencies/code-server
      - name: Resolve immutable code-server component identity
        id: code_server_identity
        run: node tooling/release-gpui/code-server-component-identity.mjs --root .dependencies/code-server --platform "linux-$LINUX_ARCH" --github-output >> "$GITHUB_OUTPUT"
      - name: Pre-fetch Zig package dependencies
        run: tooling/release-gpui/fetch-zig-deps.sh ghostty
      # Known tradeoff, deliberately not restructured.
      #
      # Unlike macOS and Windows, this job awaits gxserver *before* its cargo
      # build rather than after: `linux-stage.sh` refuses to start without the
      # package (it would otherwise build gxserver from source itself, which is
      # far worse), and `build-linux-app.sh` copies those bytes into the app dir
      # at step 5, after the compile at line 72. Starting cargo first would mean
      # splitting `build-linux-app.sh` into compile and bundle halves — a change
      # to the shared script that macOS/Windows/local builds also run, for a few
      # minutes of overlap on full rebuilds only.
      #
      # Cost when it bites: on a full rebuild the job reaches this step at
      # t≈4 min and gxserver x64 finishes at t≈11 min, so a Linux compile error
      # surfaces ~7 minutes later than it strictly could. It is still ~15 minutes
      # earlier than the old `needs: gxserver_linux_x64` edge, and in the common
      # reuse case gxserver is a ~1-minute reuse job, so the wait is ~0.
      - name: Await the gxserver runtime artifact of this run
        if: ${{ inputs.runtime_artifacts_ready }}
        env:
          GH_TOKEN: ${{ github.token }}
          GXSERVER_ARTIFACT: ${{ inputs.gxserver_source != 'release' && format('release-gxserver-linux-{0},', inputs.arch) || '' }}
        run: |
          node tooling/release-gpui/await-run-artifacts.mjs \
            --names "${GXSERVER_ARTIFACT}${{ steps.code_server_identity.outputs.artifact_name }}" \
            --producer-pattern "^(gxserver_${LINUX_ARCH}|code_server_${LINUX_ARCH}|reuse)" \
            --timeout-minutes 45
      - uses: actions/download-artifact@v8
        if: ${{ inputs.runtime_artifacts_ready && inputs.gxserver_source != 'release' }}
        with:
          name: release-gxserver-linux-${{ inputs.arch }}
          path: build/runtime-artifacts/${{ inputs.arch }}
      # CDXC:Release 2026-10-19 WHY:
      # Packages added to a release that is already public embed its live
      # runtime, never a rebuild: the live macOS app sealed those exact bytes
      # (plan.mjs, linux_arm64_gxserver_source). Both GitHub's asset digest and
      # the release's provenance record must name the downloaded bytes.
      - name: Download the live gxserver runtime of the release
        if: ${{ inputs.runtime_artifacts_ready && inputs.gxserver_source == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          TAG="v$RELEASE_VERSION"
          NAME="gxserver-linux-$LINUX_ARCH.tar.gz"
          PROVENANCE="release-provenance-$RELEASE_VERSION.json"
          DIR="build/runtime-artifacts/$LINUX_ARCH"
          mkdir -p "$DIR"
          tooling/release-gpui/retry.sh 4 2 -- gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$NAME" --pattern "$PROVENANCE" --dir "$DIR" --clobber
          ACTUAL="$(sha256sum "$DIR/$NAME" | awk '{ print $1 }')"
          LIVE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$NAME\") | .digest")"
          RECORDED="$(jq -r --arg product "gxserver-linux-$LINUX_ARCH" --arg name "$NAME" \
            '.products[$product].artifacts[] | select(.name == $name) | .sha256' "$DIR/$PROVENANCE")"
          if [[ "sha256:$ACTUAL" != "$LIVE" || "$ACTUAL" != "$RECORDED" ]]; then
            echo "::error::$TAG $NAME is $ACTUAL; GitHub reports $LIVE and $PROVENANCE records $RECORDED" >&2
            exit 1
          fi
          rm "$DIR/$PROVENANCE"
          echo "Embedding the live $TAG $NAME (sha256 $ACTUAL)"
      - uses: actions/download-artifact@v8
        if: ${{ inputs.runtime_artifacts_ready }}
        with:
          name: ${{ steps.code_server_identity.outputs.artifact_name }}
          path: build/runtime-artifacts/code-server-${{ inputs.arch }}
      - name: Reuse the published Source component for standalone runs
        if: ${{ ! inputs.runtime_artifacts_ready }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tooling/release-gpui/retry.sh 4 2 -- node tooling/release-gpui/publish-component.mjs \
            --reuse-published \
            --metadata-only \
            --require-sha256-sidecars \
            --component code-server \
            --version '${{ steps.code_server_identity.outputs.component_version }}' \
            --platform "linux-$LINUX_ARCH" \
            --asset-dir "build/runtime-artifacts/code-server-$LINUX_ARCH" \
            --output build/runtime-artifacts/code-server-components.json
      - name: Validate the Source component archive
        run: |
          node tooling/release-gpui/verify-code-server-archive.mjs \
            --archive "build/runtime-artifacts/code-server-$LINUX_ARCH/${{ steps.code_server_identity.outputs.archive_name }}" \
            --version '${{ steps.code_server_identity.outputs.component_version }}' \
            --platform "linux-$LINUX_ARCH"
      - name: Restore remote runtime package
        if: ${{ inputs.runtime_artifacts_ready }}
        run: |
          mkdir -p "build/remote-gxserver-linux/$LINUX_ARCH/package"
          tar -xzf "build/runtime-artifacts/$LINUX_ARCH/gxserver-linux-$LINUX_ARCH.tar.gz" -C "build/remote-gxserver-linux/$LINUX_ARCH/package"
      - name: Stage the Linux desktop payload once
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENTS_GITHUB_TOKEN: ${{ secrets.COMPONENTS_GITHUB_TOKEN }}
          GHOSTEX_CODE_SERVER_COMPONENT_VERSION: ${{ steps.code_server_identity.outputs.component_version }}
          GHOSTEX_ON_DEMAND_CODE_SERVER_LINUX_X64_ARCHIVE: ${{ github.workspace }}/build/runtime-artifacts/code-server-x64/${{ steps.code_server_identity.outputs.archive_name }}
          GHOSTEX_ON_DEMAND_CODE_SERVER_LINUX_ARM64_ARCHIVE: ${{ github.workspace }}/build/runtime-artifacts/code-server-arm64/${{ steps.code_server_identity.outputs.archive_name }}
        run: tooling/release-gpui/linux-stage.sh "${{ inputs.version }}" "$GHOSTEX_LINUX_PACKAGE_ROOT"
      # RPM and the portable tarball first: both archive the whole staged root,
      # and linux-deb.sh creates DEBIAN/ inside it.
      - name: Build the RPM package
        if: ${{ contains(inputs.packages, 'rpm') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tooling/release-gpui/linux-rpm.sh "${{ inputs.version }}"
          # Risk R8: the shared package root is reused by the DEB step, so prove
          # the RPM payload never contains Debian control metadata.
          RPM_PATH="$(realpath "build/release-gpui/${{ inputs.version }}/linux-rpm-$LINUX_ARCH/ghostex-${{ inputs.version }}-1.$LINUX_RPM_ARCH.rpm")"
          if rpm -qpl "$RPM_PATH" | grep -q '^/DEBIAN'; then
            echo "RPM payload leaked DEBIAN/ control metadata" >&2
            exit 1
          fi
          # The install checks below use --nodeps, so check the generated
          # requirements here: CEF arrives on demand and no distribution
          # package provides libcef.so (linux-rpm.sh excludes it).
          if rpm -qpR "$RPM_PATH" | grep -q '^libcef'; then
            echo "RPM requires libcef.so, which dnf cannot resolve" >&2
            exit 1
          fi
          # Exercise the package manager's exact same-version replacement path
          # in an isolated root. Downloaded RPMs must support both upgrades and
          # an explicit reinstall without retaining stale /opt payload files.
          RPM_TEST_ROOT="$(mktemp -d)"
          trap 'sudo rm -rf "$RPM_TEST_ROOT"' EXIT
          sudo rpm --root "$RPM_TEST_ROOT" --initdb
          sudo rpm --root "$RPM_TEST_ROOT" --install --nodeps "$RPM_PATH"
          sudo rpm --root "$RPM_TEST_ROOT" --upgrade --replacepkgs --nodeps "$RPM_PATH"
          sudo test -x "$RPM_TEST_ROOT/opt/ghostex/Ghostex"
          sudo test -x "$RPM_TEST_ROOT/opt/ghostex/gxserver/bin/tailcat"
          sudo test -x "$RPM_TEST_ROOT/usr/bin/ghostex"
          sudo test -L "$RPM_TEST_ROOT/usr/bin/gx"
      - name: Build the portable tarball
        if: ${{ contains(inputs.packages, 'tar') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tooling/release-gpui/linux-tar.sh "${{ inputs.version }}"
          # Prove the published archive really installs onto a filesystem root
          # with its prefix intact: /usr/bin/ghostex wraps hardcoded
          # /opt/ghostex paths, and gx must arrive as a symlink, not a copy.
          TAR_PATH="$(realpath "build/release-gpui/${{ inputs.version }}/linux-tar-$LINUX_ARCH/ghostex-${{ inputs.version }}-linux-$LINUX_ARCH.tar.zst")"
          TAR_TEST_ROOT="$(mktemp -d)"
          trap 'sudo rm -rf "$TAR_TEST_ROOT"' EXIT
          zstd -dc "$TAR_PATH" | sudo tar -xpf - -C "$TAR_TEST_ROOT"
          sudo test -x "$TAR_TEST_ROOT/opt/ghostex/Ghostex"
          sudo test -x "$TAR_TEST_ROOT/opt/ghostex/gxserver/bin/tailcat"
          sudo test -x "$TAR_TEST_ROOT/usr/bin/ghostex"
          sudo test -L "$TAR_TEST_ROOT/usr/bin/gx"
          sudo test ! -e "$TAR_TEST_ROOT/DEBIAN"
      - name: Build the AppImage
        if: ${{ contains(inputs.packages, 'appimage') }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty in a fork: linux-appimage.sh then builds the image unsigned and says so.
          GHOSTEX_APPIMAGE_SIGNING_KEY: ${{ secrets.GHOSTEX_APPIMAGE_SIGNING_KEY }}
          GHOSTEX_APPIMAGE_SIGNING_PASSPHRASE: ${{ secrets.GHOSTEX_APPIMAGE_SIGNING_PASSPHRASE }}
        run: |
          tooling/release-gpui/linux-appimage.sh "${{ inputs.version }}"
          # Unpack the published image with its own runtime (no FUSE needed)
          # and prove what a user's first launch relies on: AppRun, the payload
          # id it copies by, the desktop entry and icon, and a payload that
          # still leaves CEF to the on-demand component. Then what AppImage
          # managers read: the runtime's own answer for the update information,
          # the zsync file beside the image, the homepage and the metainfo.
          APPIMAGE_PATH="$(realpath "build/release-gpui/${{ inputs.version }}/linux-appimage-$LINUX_ARCH/ghostex-${{ inputs.version }}-linux-$LINUX_ARCH.AppImage")"
          test "$("$APPIMAGE_PATH" --appimage-updateinformation)" = "gh-releases-zsync|maddada|Ghostex|latest|ghostex-*-linux-$LINUX_ARCH.AppImage.zsync"
          grep -qx "Filename: $(basename "$APPIMAGE_PATH")" "$APPIMAGE_PATH.zsync"
          APPIMAGE_TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$APPIMAGE_TEST_DIR"' EXIT
          (cd "$APPIMAGE_TEST_DIR" && "$APPIMAGE_PATH" --appimage-extract >/dev/null)
          ROOT="$APPIMAGE_TEST_DIR/squashfs-root"
          test -x "$ROOT/AppRun"
          grep -qx "${{ inputs.version }}-[0-9a-f]\{16\}" "$ROOT/.ghostex-appimage"
          grep -qx 'Exec=ghostex %U' "$ROOT/ghostex.desktop"
          test -s "$ROOT/ghostex.png"
          test -x "$ROOT/opt/ghostex/Ghostex"
          test -x "$ROOT/opt/ghostex/gxserver/bin/ghostex"
          test -x "$ROOT/opt/ghostex/gxserver/bin/tailcat"
          test ! -e "$ROOT/opt/ghostex/libcef.so"
          test ! -e "$ROOT/DEBIAN"
          grep -qx 'X-AppImage-Homepage=https://ghostex.dev' "$ROOT/ghostex.desktop"
          appstreamcli validate --no-net "$ROOT/usr/share/metainfo/dev.ghostex.ghostex.metainfo.xml"
      # What the AppImage catalog does to every image: start it on a clean
      # Ubuntu 22.04 without network and wait for a window.
      - name: Start the AppImage on a clean offline host
        if: ${{ contains(inputs.packages, 'appimage') }}
        run: |
          tooling/release-gpui/linux-appimage-smoke.sh \
            "build/release-gpui/${{ inputs.version }}/linux-appimage-$LINUX_ARCH/ghostex-${{ inputs.version }}-linux-$LINUX_ARCH.AppImage"
      - name: Build the DEB package
        if: ${{ contains(inputs.packages, 'deb') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tooling/release-gpui/linux-deb.sh "${{ inputs.version }}"
          # Resolve the built package against this Ubuntu runner's real package
          # database, then install the same downloaded DEB again through dpkg.
          # This catches renamed distro dependencies as well as package-owned
          # file replacement regressions before publication.
          DEB_PATH="$(realpath "build/release-gpui/${{ inputs.version }}/linux-deb-$LINUX_ARCH/ghostex_${{ inputs.version }}_$LINUX_DEB_ARCH.deb")"
          sudo apt-get install -y --no-install-recommends "$DEB_PATH"
          sudo dpkg --install "$DEB_PATH"
          test -x /opt/ghostex/Ghostex
          test -x /usr/bin/ghostex
          # The bundled tailcat must run on this host and be the pinned one
          # (TOOLCHAIN.tailcat in product-inputs.mjs), or Cloud Boxes cannot dial.
          TAILCAT_EXPECTED="$(bun -e 'import { TOOLCHAIN } from "./tooling/release-gpui/product-inputs.mjs"; console.log(TOOLCHAIN.tailcat)')"
          TAILCAT_VERSION="$(/opt/ghostex/gxserver/bin/tailcat version | head -n 1)"
          if [[ -z "$TAILCAT_EXPECTED" || "$TAILCAT_VERSION" != "$TAILCAT_EXPECTED" ]]; then
            echo "Bundled tailcat reports '$TAILCAT_VERSION'; the release pins '$TAILCAT_EXPECTED'" >&2
            exit 1
          fi
          test -L /usr/bin/gx
          test "$(dpkg-query --showformat='${Version}' --show ghostex)" = "${{ inputs.version }}"
      - name: Attest the RPM package
        if: ${{ contains(inputs.packages, 'rpm') && !inputs.build_only }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/release-gpui/${{ inputs.version }}/linux-rpm-${{ env.LINUX_ARCH }}/ghostex-${{ inputs.version }}-1.${{ env.LINUX_RPM_ARCH }}.rpm
      - name: Attest the portable tarball
        if: ${{ contains(inputs.packages, 'tar') && !inputs.build_only }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/release-gpui/${{ inputs.version }}/linux-tar-${{ env.LINUX_ARCH }}/ghostex-${{ inputs.version }}-linux-${{ env.LINUX_ARCH }}.tar.zst
      # CDXC:Release 2026-11-08 WHY: the AppImage product is the image and its .zsync file (product-inputs.mjs), and a reuse redispatch verifies an attestation for every file of the product, so attesting only the image made 11.1.0's reuse refuse "ghostex-11.1.0-linux-x64.AppImage.zsync has no verifiable build attestation".
      - name: Attest the AppImage
        if: ${{ contains(inputs.packages, 'appimage') && !inputs.build_only }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build/release-gpui/${{ inputs.version }}/linux-appimage-${{ env.LINUX_ARCH }}/ghostex-${{ inputs.version }}-linux-${{ env.LINUX_ARCH }}.AppImage
            build/release-gpui/${{ inputs.version }}/linux-appimage-${{ env.LINUX_ARCH }}/ghostex-${{ inputs.version }}-linux-${{ env.LINUX_ARCH }}.AppImage.zsync
      - name: Attest the DEB package
        if: ${{ contains(inputs.packages, 'deb') && !inputs.build_only }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/release-gpui/${{ inputs.version }}/linux-deb-${{ env.LINUX_ARCH }}/ghostex_${{ inputs.version }}_${{ env.LINUX_DEB_ARCH }}.deb
      - name: Report kache statistics
        if: ${{ always() && steps.kache.conclusion == 'success' }}
        run: kache stats
      - name: Record job observability
        if: ${{ always() }}
        run: |
          {
            echo "- Packages produced: ${{ inputs.packages }} for linux-$LINUX_ARCH (single compile)"
            echo "- gxserver source: ${{ inputs.gxserver_source || 'run' }}; build only: ${{ inputs.build_only && 'yes' || 'no' }}"
            echo "- Cargo registry cache: ${{ steps.cargo_cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
            echo "- CEF distribution cache: ${{ steps.cef_cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
            echo "- Zig package cache: ${{ steps.zig_cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ contains(inputs.packages, 'rpm') }}
        with:
          name: release-linux-rpm-${{ env.LINUX_ARCH }}
          path: build/release-gpui/${{ inputs.version }}/linux-rpm-${{ env.LINUX_ARCH }}/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ contains(inputs.packages, 'tar') }}
        with:
          name: release-linux-tar-${{ env.LINUX_ARCH }}
          path: build/release-gpui/${{ inputs.version }}/linux-tar-${{ env.LINUX_ARCH }}/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ contains(inputs.packages, 'appimage') }}
        with:
          name: release-linux-appimage-${{ env.LINUX_ARCH }}
          path: build/release-gpui/${{ inputs.version }}/linux-appimage-${{ env.LINUX_ARCH }}/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ contains(inputs.packages, 'deb') }}
        with:
          name: release-linux-deb-${{ env.LINUX_ARCH }}
          path: build/release-gpui/${{ inputs.version }}/linux-deb-${{ env.LINUX_ARCH }}/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.plan != '' && contains(inputs.packages, 'rpm') }}
        with:
          name: release-provenance-linux-rpm-${{ env.LINUX_ARCH }}
          path: build/release-gpui/${{ inputs.version }}/linux-rpm-${{ env.LINUX_ARCH }}/provenance.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.plan != '' && contains(inputs.packages, 'tar') }}
        with:
          name: release-provenance-linux-tar-${{ env.LINUX_ARCH }}
          path: build/release-gpui/${{ inputs.version }}/linux-tar-${{ env.LINUX_ARCH }}/provenance.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.plan != '' && contains(inputs.packages, 'appimage') }}
        with:
          name: release-provenance-linux-appimage-${{ env.LINUX_ARCH }}
          path: build/release-gpui/${{ inputs.version }}/linux-appimage-${{ env.LINUX_ARCH }}/provenance.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.plan != '' && contains(inputs.packages, 'deb') }}
        with:
          name: release-provenance-linux-deb-${{ env.LINUX_ARCH }}
          path: build/release-gpui/${{ inputs.version }}/linux-deb-${{ env.LINUX_ARCH }}/provenance.json
          if-no-files-found: error
          retention-days: 14
      # A build-only run publishes no component, so a tester serves this sealed
      # archive through GHOSTEX_ON_DEMAND_BASE_URL (<base>/<downloadTag>/<asset>).
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.build_only }}
        with:
          name: release-linux-cef-component-${{ env.LINUX_ARCH }}
          path: |
            build/on-demand-components/assets/cef-*-linux-${{ env.LINUX_ARCH }}.tar.gz
            build/on-demand-components/components.json
          if-no-files-found: error
          retention-days: 14
