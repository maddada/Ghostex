name: Release build - React Native Android

on:
  workflow_dispatch:
    inputs:
      version: { description: "Semver release version", required: true, type: string }
      source_sha: { description: "Immutable application source commit", required: true, type: string }
      channel: { description: "Release channel", required: true, default: stable, type: choice, options: [stable, prerelease, test] }
      update_sparkle: { description: "Whether assembly may eventually update Sparkle", required: true, default: true, type: boolean }
      prerequisite_run_id: { description: "Optional prerequisite workflow run", required: false, type: string }

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out immutable application source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          submodules: false
      - name: Check out current release automation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          path: .release-automation
          fetch-depth: 1
          submodules: false
      - name: Verify source and workflow revisions
        run: |
          node .release-automation/scripts/release-resumable.mjs validate-source "${{ inputs.version }}" "${{ inputs.source_sha }}"
          echo "GHOSTEX_RELEASE_WORKFLOW_SHA=$(git -C .release-automation rev-parse HEAD)" >> "$GITHUB_ENV"
          printf '/.release-automation/\n' >> .git/info/exclude
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.13.1 }
      - name: Restore pinned React Native sources
        env:
          MOBILE_DEPLOY_KEY: ${{ secrets.GHOSTEX_MOBILE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$MOBILE_DEPLOY_KEY"
          mkdir -p "$RUNNER_TEMP/mobile-ssh"
          printf '%s\n' "$MOBILE_DEPLOY_KEY" > "$RUNNER_TEMP/mobile-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/mobile-ssh/id_ed25519"
          gh api meta --jq '.ssh_keys[]' | sed 's/^/github.com /' > "$RUNNER_TEMP/mobile-ssh/known_hosts"
          git config submodule.mobile.url git@github.com:maddada/ghostex-mobile.git
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/mobile-ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/mobile-ssh/known_hosts" \
            git submodule update --init --depth 1 apps/mobile/app
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17.0.19+10'
      - name: Install pinned Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"
      - name: Install JavaScript dependencies
        working-directory: apps/mobile/app
        run: bun install --frozen-lockfile
      - name: Restore Gradle build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/app/bun.lock', 'apps/mobile/app/package.json') }}
          restore-keys: android-gradle-${{ runner.os }}-
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ghostex-release.jks"
          chmod 600 "$RUNNER_TEMP/ghostex-release.jks"
      - name: Build and verify Android package
        env:
          GHOSTEX_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          GHOSTEX_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          GHOSTEX_ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/ghostex-release.jks
          GHOSTEX_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          GHOSTEX_RELEASE_REPO_ROOT: ${{ github.workspace }}
          GHOSTEX_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: .release-automation/scripts/release-mobile/android.sh "${{ inputs.version }}"
      - name: Preserve package across runs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.version }}-${{ inputs.source_sha }}-android
          path: build/release-gpui/${{ inputs.version }}/android/
          if-no-files-found: error
          retention-days: 90

  stage:
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: release-state-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.13.1 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.version }}-${{ inputs.source_sha }}-android
          path: build/stage/android
      - name: Stage immutable package and metadata
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node scripts/release-resumable.mjs stage-package-and-advance "${{ inputs.version }}" "${{ inputs.source_sha }}" android build/stage/android "$(git rev-parse HEAD)" "${{ inputs.channel }}" "${{ inputs.update_sparkle }}"
