name: Release Ghostex

# CDXC:ReleaseChangeAwarePlanning 2026-08-13:
# Change-aware release graph.
#
# Two structural changes drive everything below.
#
# 1. Enabled is not the same as built. The scope inputs express *intent*; the
#    plan computed in `prepare` decides the *action* for each product: build,
#    reuse (byte-identical re-publication of verified bytes), or skip. Every
#    in-scope product still ships real bytes on `v<version>` — shipped macOS
#    apps resolve on-demand assets from `v{manifest.version}`, so omission is
#    never an option.
#
# 2. No packaging job waits on gxserver any more. macOS, Linux, and Windows
#    never needed gxserver to finish before they could *compile*; they needed
#    its tarball at packaging time. They now await it just in time
#    (await-run-artifacts.mjs), which moves every platform's compiler errors
#    from t≈22 min to t≈2 min and takes ~21 min off the critical path.
#
# CDXC:Release 2026-09-15 DECISION:
# User: no platform waits for another. There is no single publish gate any
# more: each platform has its own publish stage (publish_macos, publish_android,
# publish_linux, publish_linux_arm64, publish_windows_x64, publish_windows_arm64) that needs only the
# `gates` job and that platform's own build jobs. The first stage to finish
# creates the tag and the release, every later stage amends it, and a failed
# platform leaves the others live (tooling/release-gpui/publish-stage.mjs owns
# the stage membership and the rationale; publish-staged.mjs decides create vs
# amend against live state). Before this, 9.5.1 had macOS, Linux and Android
# built at minute 45 and published none of them until Windows was fixed two
# hours later.
#
# 3. `prepare` only resolves the plan (about 40 seconds on ubuntu) so every
#    build starts immediately; the frozen install, typecheck and release tests
#    run in the parallel `gates` job, which only the publish stages wait on.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version already present in package.json and CHANGELOG.md
        required: true
        type: string
      macos:
        description: Build macOS arm64 GPUI DMG
        required: true
        default: true
        type: boolean
      update_sparkle:
        description: Advance the production macOS Sparkle feed
        required: true
        default: true
        type: boolean
      linux_deb:
        description: Build Debian/Ubuntu x64 DEB
        required: true
        default: true
        type: boolean
      linux_rpm:
        description: Build Fedora/RHEL x64 RPM
        required: true
        default: true
        type: boolean
      linux_tar:
        description: Build the portable x64 tar.zst (Arch, mise/ubi, AUR)
        required: true
        default: true
        type: boolean
      linux_appimage:
        description: Build the x64 AppImage
        required: true
        default: true
        type: boolean
      linux_deb_arm64:
        description: Build Debian/Ubuntu ARM64 DEB
        required: true
        default: true
        type: boolean
      linux_rpm_arm64:
        description: Build Fedora/RHEL ARM64 RPM
        required: true
        default: true
        type: boolean
      linux_tar_arm64:
        description: Build the portable ARM64 tar.zst
        required: true
        default: true
        type: boolean
      linux_appimage_arm64:
        description: Build the ARM64 AppImage
        required: true
        default: true
        type: boolean
      windows_x64:
        description: Build Windows x64 installer and update packages
        required: true
        default: true
        type: boolean
      windows_arm64:
        description: Build Windows ARM64 installer and update packages
        required: true
        default: true
        type: boolean
      sign_windows:
        description: Authenticode-sign Windows packages through SignPath (skipped when SIGNPATH_API_TOKEN is not set)
        required: true
        default: false
        type: boolean
      android:
        description: Build signed React Native Android APK
        required: true
        default: true
        type: boolean
      gxserver_linux_x64:
        description: Publish the static Linux x64 gxserver runtime
        required: true
        default: true
        type: boolean
      gxserver_linux_arm64:
        description: Publish the static Linux ARM64 gxserver runtime
        required: true
        default: true
        type: boolean
      gxserver_wsl_windows_x64:
        description: Publish the Windows x64 WSL gxserver bootstrap
        required: true
        default: true
        type: boolean
      gxserver_wsl_windows_arm64:
        description: Publish the Windows ARM64 WSL gxserver bootstrap
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean
      force_all:
        description: Rebuild every in-scope product, ignoring verified reuse
        required: false
        default: false
        type: boolean
      force_products:
        description: Comma-separated product ids to rebuild even when unchanged
        required: false
        default: ''
        type: string
      reuse_from_run_id:
        description: Failed Release Ghostex run whose successful products may be reused
        required: false
        default: ''
        type: string
      # CDXC:Release 2026-10-19 WHY:
      # Linux ARM64 had to be proven on real hardware before it reached a
      # release page. A build-only run builds the scoped products and uploads
      # them as Actions artifacts, and nothing else: every publish stage is
      # skipped, the Linux job seals its CEF component without uploading it,
      # and preflight refuses any scope whose build jobs publish on their own
      # (macOS, Windows, Android, WSL, a code-server component build).
      build_only:
        description: Build and upload Actions artifacts only; publish nothing (Linux packages and gxserver runtimes)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # A build-only run must never queue behind, or cancel the pending slot of, a real release of the same version.
  group: ghostex-gpui-release-${{ inputs.version }}${{ inputs.build_only && '-build-only' || '' }}
  cancel-in-progress: false

jobs:
  prepare:
    # Plan resolution only: no install, no typecheck, no tests. Those run in
    # `gates` in parallel so the builds start about 90 seconds earlier.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      expected_platforms: ${{ steps.plan.outputs.expected_platforms }}
      feeds_sparkle: ${{ steps.plan.outputs.feeds_sparkle }}
      job_android: ${{ steps.plan.outputs.job_android }}
      job_code_server_arm64: ${{ steps.plan.outputs.job_code_server_arm64 }}
      job_code_server_darwin_arm64: ${{ steps.plan.outputs.job_code_server_darwin_arm64 }}
      job_code_server_windows_arm64: ${{ steps.plan.outputs.job_code_server_windows_arm64 }}
      job_code_server_windows_x64: ${{ steps.plan.outputs.job_code_server_windows_x64 }}
      job_code_server_x64: ${{ steps.plan.outputs.job_code_server_x64 }}
      job_gxserver_arm64: ${{ steps.plan.outputs.job_gxserver_arm64 }}
      job_gxserver_x64: ${{ steps.plan.outputs.job_gxserver_x64 }}
      job_linux_arm64: ${{ steps.plan.outputs.job_linux_arm64 }}
      job_linux_x64: ${{ steps.plan.outputs.job_linux_x64 }}
      job_macos: ${{ steps.plan.outputs.job_macos }}
      job_windows_arm64: ${{ steps.plan.outputs.job_windows_arm64 }}
      job_windows_x64: ${{ steps.plan.outputs.job_windows_x64 }}
      job_wsl_arm64: ${{ steps.plan.outputs.job_wsl_arm64 }}
      job_wsl_x64: ${{ steps.plan.outputs.job_wsl_x64 }}
      linux_arm64_gxserver_source: ${{ steps.plan.outputs.linux_arm64_gxserver_source }}
      linux_arm64_packages: ${{ steps.plan.outputs.linux_arm64_packages }}
      linux_packages: ${{ steps.plan.outputs.linux_packages }}
      plan: ${{ steps.plan.outputs.plan }}
      reuse_count: ${{ steps.plan.outputs.reuse_count }}
      reuse_matrix: ${{ steps.plan.outputs.reuse_matrix }}
    env:
      GHOSTEX_RELEASE_MACOS: ${{ inputs.macos }}
      GHOSTEX_RELEASE_LINUX_DEB: ${{ inputs.linux_deb }}
      GHOSTEX_RELEASE_LINUX_RPM: ${{ inputs.linux_rpm }}
      GHOSTEX_RELEASE_LINUX_TAR: ${{ inputs.linux_tar }}
      GHOSTEX_RELEASE_LINUX_APPIMAGE: ${{ inputs.linux_appimage }}
      GHOSTEX_RELEASE_LINUX_DEB_ARM64: ${{ inputs.linux_deb_arm64 }}
      GHOSTEX_RELEASE_LINUX_RPM_ARM64: ${{ inputs.linux_rpm_arm64 }}
      GHOSTEX_RELEASE_LINUX_TAR_ARM64: ${{ inputs.linux_tar_arm64 }}
      GHOSTEX_RELEASE_LINUX_APPIMAGE_ARM64: ${{ inputs.linux_appimage_arm64 }}
      GHOSTEX_RELEASE_BUILD_ONLY: ${{ inputs.build_only }}
      GHOSTEX_RELEASE_WINDOWS_X64: ${{ inputs.windows_x64 }}
      GHOSTEX_RELEASE_WINDOWS_ARM64: ${{ inputs.windows_arm64 }}
      GHOSTEX_RELEASE_SIGN_WINDOWS: ${{ inputs.sign_windows }}
      GHOSTEX_RELEASE_ANDROID: ${{ inputs.android }}
      GHOSTEX_RELEASE_GXSERVER_LINUX_X64: ${{ inputs.gxserver_linux_x64 }}
      GHOSTEX_RELEASE_GXSERVER_LINUX_ARM64: ${{ inputs.gxserver_linux_arm64 }}
      GHOSTEX_RELEASE_GXSERVER_WSL_WINDOWS_X64: ${{ inputs.gxserver_wsl_windows_x64 }}
      GHOSTEX_RELEASE_GXSERVER_WSL_WINDOWS_ARM64: ${{ inputs.gxserver_wsl_windows_arm64 }}
      GHOSTEX_RELEASE_UPDATE_SPARKLE: ${{ inputs.update_sparkle }}
      GHOSTEX_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      # A recovery redispatch after a partial staged publish targets a tag that
      # already exists; its stages amend the live release.
      GHOSTEX_RELEASE_ALLOW_EXISTING_TAG: ${{ inputs.reuse_from_run_id != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - name: Validate immutable release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          GHOSTEX_MOBILE_DEPLOY_KEY: ${{ secrets.GHOSTEX_MOBILE_DEPLOY_KEY }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          COMPONENTS_GITHUB_TOKEN: ${{ secrets.COMPONENTS_GITHUB_TOKEN }}
        run: node tooling/release-gpui/preflight.mjs "${{ inputs.version }}"
      - name: Verify clean GPUI release reference contract
        if: ${{ inputs.macos || inputs.linux_deb || inputs.linux_rpm || inputs.linux_tar || inputs.linux_appimage || inputs.linux_deb_arm64 || inputs.linux_rpm_arm64 || inputs.linux_tar_arm64 || inputs.linux_appimage_arm64 || inputs.windows_x64 || inputs.windows_arm64 }}
        run: node tooling/release-gpui/verify-reference-contract.mjs --clean
      # The pin check reads zmx's own build.zig.zon, and zmx is a submodule the
      # prepare checkout deliberately skips, so init just that path first.
      - name: Restore the zmx manifest for the Zig pin check
        if: ${{ inputs.macos || inputs.linux_deb || inputs.linux_rpm || inputs.linux_tar || inputs.linux_appimage || inputs.linux_deb_arm64 || inputs.linux_rpm_arm64 || inputs.linux_tar_arm64 || inputs.linux_appimage_arm64 || inputs.windows_x64 || inputs.windows_arm64 }}
        run: git submodule update --init --depth 1 .dependencies/zmx
      - name: Check the Ghostty Zig toolchain pin against the vendored source
        if: ${{ inputs.macos || inputs.linux_deb || inputs.linux_rpm || inputs.linux_tar || inputs.linux_appimage || inputs.linux_deb_arm64 || inputs.linux_rpm_arm64 || inputs.linux_tar_arm64 || inputs.linux_appimage_arm64 || inputs.windows_x64 || inputs.windows_arm64 }}
        run: node tooling/release-gpui/check-ghostty-zig-pin.mjs
      # 9.5.1 lost its first dispatch 30 seconds into both code-server jobs
      # because the ripgrep patch no longer applied to the bumped submodule.
      - name: Check that every release patch still applies to its submodule
        if: ${{ inputs.macos || inputs.linux_deb || inputs.linux_rpm || inputs.linux_tar || inputs.linux_appimage || inputs.linux_deb_arm64 || inputs.linux_rpm_arm64 || inputs.linux_tar_arm64 || inputs.linux_appimage_arm64 || inputs.windows_x64 || inputs.windows_arm64 }}
        run: |
          git submodule update --init --depth 1 .dependencies/code-server
          node tooling/release-gpui/check-patches-apply.mjs --only code-server
      - name: Resolve the change-aware release plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FORCE_ALL: ${{ inputs.force_all }}
          RELEASE_FORCE_PRODUCTS: ${{ inputs.force_products }}
          RELEASE_REUSE_FROM_RUN_ID: ${{ inputs.reuse_from_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p build/release-gpui
          ARGS=()
          if [[ "$RELEASE_FORCE_ALL" == "true" ]]; then
            ARGS+=(--force-all)
          elif [[ -n "$RELEASE_FORCE_PRODUCTS" ]]; then
            ARGS+=(--force "$RELEASE_FORCE_PRODUCTS")
          fi
          if [[ -n "$RELEASE_REUSE_FROM_RUN_ID" ]]; then
            ARGS+=(--reuse-from-run "$RELEASE_REUSE_FROM_RUN_ID")
          fi
          node tooling/release-gpui/plan-cli.mjs "$RELEASE_VERSION" \
            --source-sha "${{ github.sha }}" \
            --output build/release-gpui/release-plan.json \
            --emit-github-output \
            --emit-step-summary \
            "${ARGS[@]}"
      - name: Validate the plan against the requested scope
        run: node tooling/release-gpui/preflight.mjs "${{ inputs.version }}" --only-plan --plan build/release-gpui/release-plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: build/release-gpui/release-plan.json
          if-no-files-found: error
          retention-days: 14

  # The expensive source gates, off the critical path of every build. Only the
  # publish stages need this job, so a failing test never wastes a build that
  # a `--reuse-from-run` redispatch can reuse, and a passing one never delays
  # a compile. The dispatcher already ran `release:test` locally against this
  # exact commit; this is the remote, frozen-install repetition.
  gates:
    # Stays on macos-15 until `bun run release:test` is verified green on
    # ubuntu-24.04; the runner choice is an optimization, not a requirement.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # release:test reads zmx's build.zig.zon for the Zig pin assertion.
      - name: Restore release-test prerequisites
        run: |
          git submodule update --init --depth 1 .dependencies/code-server
          git submodule update --init --depth 1 .dependencies/zmx
      # The typecheck's format check runs `cargo fmt` inside apps/desktop and
      # server, whose rust-toolchain.toml pins a channel the runner lacks; rustup
      # would install it with the runner's minimal profile, which has no rustfmt.
      - name: Install rustfmt for the pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' apps/desktop/rust-toolchain.toml)"
          tooling/release-gpui/retry.sh 3 5 -- rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          tooling/release-gpui/retry.sh 3 5 -- rustup component add rustfmt
      - name: Install and typecheck
        run: |
          bun install --frozen-lockfile
          cargo xtask typecheck
          bun run release:test

  # CDXC:WindowsValidationIsNotAGate 2026-09-01:
  # There is deliberately no `validate_windows` job here any more.
  #
  # It was a Windows `cargo check` gate in front of the two Windows packaging
  # jobs. Measured on 8.4.0 (run 33358931668): validate_windows 23m04s,
  # windows_x64 22m37s, windows_arm64 23m59s — the gate cost as much as the
  # thing it gated, and the packaging jobs started 4 seconds after it finished.
  # So every release paid ~23 minutes of critical path to learn, about one
  # minute early, exactly what `cargo build` in the Windows jobs was about to
  # tell it anyway. The Windows builds compile the same tree, natively, per
  # architecture; they ARE the Windows compile validation.
  #
  # The gate's only remaining value was saving the runner-minutes of one
  # duplicated Windows job on a release that fails to compile on Windows. That
  # became cheap independently: `--reuse-from-run` reuses every product that
  # already succeeded, on its own provenance evidence, so a redispatch after a
  # Windows failure rebuilds only Windows.
  #
  # .github/workflows/release-gpui-validate.yml is kept as an opt-in
  # workflow_dispatch check for cycles with heavy Windows-conditional Rust
  # churn (it also `cargo check`s the Windows gxserver tree, which nothing in
  # the release pipeline compiles). It must not be wired back in as a `needs:`
  # of windows_x64, windows_arm64, or publish.

  gxserver_x64:
    if: ${{ needs.prepare.outputs.job_gxserver_x64 == 'build' }}
    needs: prepare
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-gpui-gxserver.yml
    with:
      version: ${{ inputs.version }}
      arch: x64
      build_only: ${{ inputs.build_only }}
      plan: ${{ needs.prepare.outputs.plan }}

  gxserver_arm64:
    if: ${{ needs.prepare.outputs.job_gxserver_arm64 == 'build' }}
    needs: prepare
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-gpui-gxserver.yml
    with:
      version: ${{ inputs.version }}
      arch: arm64
      build_only: ${{ inputs.build_only }}
      plan: ${{ needs.prepare.outputs.plan }}

  code_server_x64:
    if: ${{ needs.prepare.outputs.job_code_server_x64 != 'skip' }}
    needs: prepare
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-gpui-code-server.yml
    with:
      version: ${{ inputs.version }}
      arch: x64
    secrets: inherit

  code_server_arm64:
    if: ${{ needs.prepare.outputs.job_code_server_arm64 != 'skip' }}
    needs: prepare
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-gpui-code-server.yml
    with:
      version: ${{ inputs.version }}
      arch: arm64
    secrets: inherit

  # The macOS Code-tab component, built off the macOS job's critical path.
  # The macOS job awaits this job's artifact just in time before staging.
  code_server_darwin_arm64:
    if: ${{ needs.prepare.outputs.job_code_server_darwin_arm64 != 'skip' }}
    needs: prepare
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-gpui-code-server-macos.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  # The native Windows editor component (VS Code REH for win32), one job per
  # architecture, built off the Windows jobs' critical path. Each Windows job
  # awaits its architecture's artifact just in time before packaging.
  code_server_windows_x64:
    if: ${{ needs.prepare.outputs.job_code_server_windows_x64 != 'skip' }}
    needs: prepare
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-gpui-code-server-windows.yml
    with:
      version: ${{ inputs.version }}
      arch: x64
    secrets: inherit

  code_server_windows_arm64:
    if: ${{ needs.prepare.outputs.job_code_server_windows_arm64 != 'skip' }}
    needs: prepare
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-gpui-code-server-windows.yml
    with:
      version: ${{ inputs.version }}
      arch: arm64
    secrets: inherit

  reuse:
    if: ${{ needs.prepare.outputs.reuse_count != '0' }}
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        product: ${{ fromJSON(needs.prepare.outputs.reuse_matrix) }}
    uses: ./.github/workflows/release-gpui-reuse.yml
    with:
      version: ${{ inputs.version }}
      product: ${{ matrix.product }}
      plan: ${{ needs.prepare.outputs.plan }}

  macos:
    if: ${{ needs.prepare.outputs.job_macos == 'build' }}
    needs: prepare
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-gpui-macos.yml
    with:
      version: ${{ inputs.version }}
      runtime_artifacts_ready: true
      update_sparkle: ${{ inputs.update_sparkle }}
      plan: ${{ needs.prepare.outputs.plan }}
    secrets: inherit

  linux_x64:
    if: ${{ needs.prepare.outputs.job_linux_x64 == 'build' }}
    needs: prepare
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-gpui-linux.yml
    with:
      version: ${{ inputs.version }}
      arch: x64
      packages: ${{ needs.prepare.outputs.linux_packages }}
      runtime_artifacts_ready: true
      build_only: ${{ inputs.build_only }}
      plan: ${{ needs.prepare.outputs.plan }}
    secrets: inherit

  # Same workflow and scripts as linux_x64, built natively on ubuntu-22.04-arm.
  # gxserver_source is `run` (await this run's gxserver-linux-arm64 artifact)
  # unless the runtime is out of scope on an existing release, then `release`
  # (embed that release's live gxserver-linux-arm64.tar.gz; plan.mjs).
  linux_arm64:
    if: ${{ needs.prepare.outputs.job_linux_arm64 == 'build' }}
    needs: prepare
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-gpui-linux.yml
    with:
      version: ${{ inputs.version }}
      arch: arm64
      packages: ${{ needs.prepare.outputs.linux_arm64_packages }}
      runtime_artifacts_ready: true
      gxserver_source: ${{ needs.prepare.outputs.linux_arm64_gxserver_source }}
      build_only: ${{ inputs.build_only }}
      plan: ${{ needs.prepare.outputs.plan }}
    secrets: inherit

  gxserver_wsl_windows_x64:
    if: ${{ needs.prepare.outputs.job_wsl_x64 == 'build' }}
    needs: prepare
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-gpui-wsl-runtime.yml
    with:
      version: ${{ inputs.version }}
      arch: x64
      plan: ${{ needs.prepare.outputs.plan }}

  gxserver_wsl_windows_arm64:
    if: ${{ needs.prepare.outputs.job_wsl_arm64 == 'build' }}
    needs: prepare
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-gpui-wsl-runtime.yml
    with:
      version: ${{ inputs.version }}
      arch: arm64
      plan: ${{ needs.prepare.outputs.plan }}

  windows_x64:
    if: ${{ needs.prepare.outputs.job_windows_x64 == 'build' }}
    # `prepare` only. The gxserver tarball, the code-server component, and the
    # native editor component are real data dependencies, but they are awaited
    # just in time inside the job (await-run-artifacts.mjs), after the Rust
    # compile, so they are not a `needs:` edge and do not delay the job's start.
    needs: prepare
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-gpui-windows.yml
    with:
      version: ${{ inputs.version }}
      arch: x64
      sign: ${{ inputs.sign_windows }}
      runtime_artifacts_ready: true
      plan: ${{ needs.prepare.outputs.plan }}
    secrets: inherit

  windows_arm64:
    if: ${{ needs.prepare.outputs.job_windows_arm64 == 'build' }}
    # See windows_x64: the runtime artifacts are awaited just in time, not via
    # a `needs:` edge.
    needs: prepare
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-gpui-windows.yml
    with:
      version: ${{ inputs.version }}
      arch: arm64
      sign: ${{ inputs.sign_windows }}
      runtime_artifacts_ready: true
      plan: ${{ needs.prepare.outputs.plan }}
    secrets: inherit

  android:
    if: ${{ needs.prepare.outputs.job_android == 'build' }}
    needs: prepare
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-gpui-android.yml
    with:
      version: ${{ inputs.version }}
      plan: ${{ needs.prepare.outputs.plan }}
    secrets: inherit

  # Stage gates keep the shape of the old atomicity gate for their own
  # products: a `build` or `reuse` action must have produced a successful job
  # and `skip` a skipped one, so a failed or cancelled job can never satisfy
  # either branch. A stage whose products are all skipped by scope does not run.
  publish_macos:
    if: >-
      ${{
        always() &&
        !inputs.build_only &&
        needs.prepare.result == 'success' &&
        needs.gates.result == 'success' &&
        needs.prepare.outputs.job_macos != 'skip' &&
        ((needs.prepare.outputs.job_gxserver_x64 == 'build' && needs.gxserver_x64.result == 'success') || (needs.prepare.outputs.job_gxserver_x64 != 'build' && needs.gxserver_x64.result == 'skipped')) &&
        ((needs.prepare.outputs.job_gxserver_arm64 == 'build' && needs.gxserver_arm64.result == 'success') || (needs.prepare.outputs.job_gxserver_arm64 != 'build' && needs.gxserver_arm64.result == 'skipped')) &&
        ((needs.prepare.outputs.reuse_count != '0' && needs.reuse.result == 'success') || (needs.prepare.outputs.reuse_count == '0' && needs.reuse.result == 'skipped')) &&
        ((needs.prepare.outputs.job_macos == 'build' && needs.macos.result == 'success') || (needs.prepare.outputs.job_macos != 'build' && needs.macos.result == 'skipped'))
      }}
    needs:
      - prepare
      - gates
      - gxserver_x64
      - gxserver_arm64
      - reuse
      - macos
    uses: ./.github/workflows/release-gpui-publish.yml
    with:
      version: ${{ inputs.version }}
      stage: macos
      expected_platforms: ${{ needs.prepare.outputs.expected_platforms }}
      prerelease: ${{ inputs.prerelease }}
      # Keyed on "macOS is in scope" rather than on plan.feeds.sparkle: a
      # same-version recovery legitimately *reuses* the macOS product from a run
      # that never published, so the appcast entry does not exist yet and
      # Sparkle must still advance.
      update_sparkle: ${{ inputs.update_sparkle && needs.prepare.outputs.job_macos != 'skip' }}
      windows_signed: ${{ inputs.sign_windows }}
      plan: ${{ needs.prepare.outputs.plan }}
    secrets: inherit

  publish_android:
    if: >-
      ${{
        always() &&
        !inputs.build_only &&
        needs.prepare.result == 'success' &&
        needs.gates.result == 'success' &&
        needs.prepare.outputs.job_android != 'skip' &&
        ((needs.prepare.outputs.reuse_count != '0' && needs.reuse.result == 'success') || (needs.prepare.outputs.reuse_count == '0' && needs.reuse.result == 'skipped')) &&
        ((needs.prepare.outputs.job_android == 'build' && needs.android.result == 'success') || (needs.prepare.outputs.job_android != 'build' && needs.android.result == 'skipped'))
      }}
    needs:
      - prepare
      - gates
      - reuse
      - android
    uses: ./.github/workflows/release-gpui-publish.yml
    with:
      version: ${{ inputs.version }}
      stage: android
      expected_platforms: ${{ needs.prepare.outputs.expected_platforms }}
      prerelease: ${{ inputs.prerelease }}
      update_sparkle: false
      windows_signed: ${{ inputs.sign_windows }}
      plan: ${{ needs.prepare.outputs.plan }}
    secrets: inherit

  # The phone app's over-the-air update for this release (tooling/release-mobile/ota-server/README.md):
  # the JavaScript the Android job exported, signed and uploaded to ota.ghostex.dev. It runs only
  # after the Android stage published, so phones never run JavaScript from a release that did not
  # come out, and never for a prerelease. Until the two secrets exist it says so and does nothing.
  publish_ota:
    if: >-
      ${{
        always() &&
        !inputs.build_only &&
        !inputs.prerelease &&
        needs.prepare.outputs.job_android == 'build' &&
        needs.publish_android.result == 'success'
      }}
    needs:
      - prepare
      - publish_android
    permissions:
      contents: read
    # The OTA-only release (release-mobile-ota.yml) publishes through the same workflow.
    uses: ./.github/workflows/release-mobile-ota-publish.yml
    secrets:
      GHOSTEX_OTA_SIGNING_KEY: ${{ secrets.GHOSTEX_OTA_SIGNING_KEY }}
      GHOSTEX_OTA_UPLOAD_TOKEN: ${{ secrets.GHOSTEX_OTA_UPLOAD_TOKEN }}

  publish_linux:
    if: >-
      ${{
        always() &&
        !inputs.build_only &&
        needs.prepare.result == 'success' &&
        needs.gates.result == 'success' &&
        needs.prepare.outputs.job_linux_x64 != 'skip' &&
        ((needs.prepare.outputs.job_gxserver_x64 == 'build' && needs.gxserver_x64.result == 'success') || (needs.prepare.outputs.job_gxserver_x64 != 'build' && needs.gxserver_x64.result == 'skipped')) &&
        ((needs.prepare.outputs.reuse_count != '0' && needs.reuse.result == 'success') || (needs.prepare.outputs.reuse_count == '0' && needs.reuse.result == 'skipped')) &&
        ((needs.prepare.outputs.job_linux_x64 == 'build' && needs.linux_x64.result == 'success') || (needs.prepare.outputs.job_linux_x64 != 'build' && needs.linux_x64.result == 'skipped'))
      }}
    needs:
      - prepare
      - gates
      - gxserver_x64
      - reuse
      - linux_x64
    uses: ./.github/workflows/release-gpui-publish.yml
    with:
      version: ${{ inputs.version }}
      stage: linux
      expected_platforms: ${{ needs.prepare.outputs.expected_platforms }}
      prerelease: ${{ inputs.prerelease }}
      update_sparkle: false
      windows_signed: ${{ inputs.sign_windows }}
      plan: ${{ needs.prepare.outputs.plan }}
    secrets: inherit

  publish_linux_arm64:
    if: >-
      ${{
        always() &&
        !inputs.build_only &&
        needs.prepare.result == 'success' &&
        needs.gates.result == 'success' &&
        needs.prepare.outputs.job_linux_arm64 != 'skip' &&
        ((needs.prepare.outputs.job_gxserver_arm64 == 'build' && needs.gxserver_arm64.result == 'success') || (needs.prepare.outputs.job_gxserver_arm64 != 'build' && needs.gxserver_arm64.result == 'skipped')) &&
        ((needs.prepare.outputs.reuse_count != '0' && needs.reuse.result == 'success') || (needs.prepare.outputs.reuse_count == '0' && needs.reuse.result == 'skipped')) &&
        ((needs.prepare.outputs.job_linux_arm64 == 'build' && needs.linux_arm64.result == 'success') || (needs.prepare.outputs.job_linux_arm64 != 'build' && needs.linux_arm64.result == 'skipped'))
      }}
    needs:
      - prepare
      - gates
      - gxserver_arm64
      - reuse
      - linux_arm64
    uses: ./.github/workflows/release-gpui-publish.yml
    with:
      version: ${{ inputs.version }}
      stage: linux-arm64
      expected_platforms: ${{ needs.prepare.outputs.expected_platforms }}
      prerelease: ${{ inputs.prerelease }}
      update_sparkle: false
      windows_signed: ${{ inputs.sign_windows }}
      plan: ${{ needs.prepare.outputs.plan }}
    secrets: inherit

  # The WSL bootstrap is not a build input of the Windows package but ships
  # beside it (companion product), so the two publish together.
  publish_windows_x64:
    if: >-
      ${{
        always() &&
        !inputs.build_only &&
        needs.prepare.result == 'success' &&
        needs.gates.result == 'success' &&
        needs.prepare.outputs.job_windows_x64 != 'skip' &&
        ((needs.prepare.outputs.job_gxserver_x64 == 'build' && needs.gxserver_x64.result == 'success') || (needs.prepare.outputs.job_gxserver_x64 != 'build' && needs.gxserver_x64.result == 'skipped')) &&
        ((needs.prepare.outputs.reuse_count != '0' && needs.reuse.result == 'success') || (needs.prepare.outputs.reuse_count == '0' && needs.reuse.result == 'skipped')) &&
        ((needs.prepare.outputs.job_windows_x64 == 'build' && needs.windows_x64.result == 'success') || (needs.prepare.outputs.job_windows_x64 != 'build' && needs.windows_x64.result == 'skipped')) &&
        ((needs.prepare.outputs.job_wsl_x64 == 'build' && needs.gxserver_wsl_windows_x64.result == 'success') || (needs.prepare.outputs.job_wsl_x64 != 'build' && needs.gxserver_wsl_windows_x64.result == 'skipped'))
      }}
    needs:
      - prepare
      - gates
      - gxserver_x64
      - reuse
      - windows_x64
      - gxserver_wsl_windows_x64
    uses: ./.github/workflows/release-gpui-publish.yml
    with:
      version: ${{ inputs.version }}
      stage: windows-x64
      expected_platforms: ${{ needs.prepare.outputs.expected_platforms }}
      prerelease: ${{ inputs.prerelease }}
      update_sparkle: false
      windows_signed: ${{ inputs.sign_windows }}
      plan: ${{ needs.prepare.outputs.plan }}
    secrets: inherit

  publish_windows_arm64:
    if: >-
      ${{
        always() &&
        !inputs.build_only &&
        needs.prepare.result == 'success' &&
        needs.gates.result == 'success' &&
        needs.prepare.outputs.job_windows_arm64 != 'skip' &&
        ((needs.prepare.outputs.job_gxserver_arm64 == 'build' && needs.gxserver_arm64.result == 'success') || (needs.prepare.outputs.job_gxserver_arm64 != 'build' && needs.gxserver_arm64.result == 'skipped')) &&
        ((needs.prepare.outputs.reuse_count != '0' && needs.reuse.result == 'success') || (needs.prepare.outputs.reuse_count == '0' && needs.reuse.result == 'skipped')) &&
        ((needs.prepare.outputs.job_windows_arm64 == 'build' && needs.windows_arm64.result == 'success') || (needs.prepare.outputs.job_windows_arm64 != 'build' && needs.windows_arm64.result == 'skipped')) &&
        ((needs.prepare.outputs.job_wsl_arm64 == 'build' && needs.gxserver_wsl_windows_arm64.result == 'success') || (needs.prepare.outputs.job_wsl_arm64 != 'build' && needs.gxserver_wsl_windows_arm64.result == 'skipped'))
      }}
    needs:
      - prepare
      - gates
      - gxserver_arm64
      - reuse
      - windows_arm64
      - gxserver_wsl_windows_arm64
    uses: ./.github/workflows/release-gpui-publish.yml
    with:
      version: ${{ inputs.version }}
      stage: windows-arm64
      expected_platforms: ${{ needs.prepare.outputs.expected_platforms }}
      prerelease: ${{ inputs.prerelease }}
      update_sparkle: false
      windows_signed: ${{ inputs.sign_windows }}
      plan: ${{ needs.prepare.outputs.plan }}
    secrets: inherit
