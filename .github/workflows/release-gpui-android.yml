name: GPUI release - React Native Android

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      plan:
        description: Resolved release plan JSON from the prepare job
        required: false
        default: ''
        type: string
      distribution:
        description: github (the sideloaded APK with the in-app updater) or play (the Google Play bundle without it)
        required: false
        default: github
        type: string
    secrets:
      ANDROID_RELEASE_KEYSTORE_BASE64:
        required: true
      ANDROID_RELEASE_STORE_PASSWORD:
        required: true
      ANDROID_RELEASE_KEY_ALIAS:
        required: true
      ANDROID_RELEASE_KEY_PASSWORD:
        required: true
      GHOSTEX_MOBILE_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version
        required: true
        type: string
      distribution:
        description: github (the sideloaded APK with the in-app updater) or play (the Google Play bundle without it)
        required: false
        default: github
        type: choice
        options:
          - github
          - play

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GHOSTEX_RELEASE_PLAN: ${{ inputs.plan }}
      GHOSTEX_RELEASE_WORKFLOW_SHA: ${{ github.sha }}
      GOMOBILE_PIN: v0.0.0-20260821190718-4776eadac327
      # The NDK compiler cache (ccache) and the gomobile bridge cache are keyed
      # on this pin, so a bump invalidates both.
      ANDROID_NDK_VERSION: 29.0.14206865
      # CDXC:Release 2026-11-11 DECISION: the GitHub APK ships arm64-v8a only
      # (user choice on 2026-10-15 after the 229 MB four-ABI APK; an arm64-only
      # build is 77 MB before compression, and every native library is packaged
      # once per ABI), and the Play bundle ships arm64-v8a and x86_64 (user,
      # 2026-11-11: "Play bundle only"). This supersedes the 2026-10-15 rule that
      # every release ships arm64-v8a only. Play splits a bundle per ABI, so
      # phones download only their own libraries, and x86_64 Chromebooks and
      # emulators get native libraries instead of the ARM translator, which
      # dies with SIGILL in the tailcat bridge (golang.org/x/sys/cpu reads
      # ID_AA64ISAR0_EL1 directly, which only an arm64 kernel emulates).
      # 32-bit ARM and x86 are not supported.
      # `tooling/release-mobile/android.sh` hands this list to Gradle as
      # `reactNativeArchitectures` (the RN plugin turns it into
      # `ndk.abiFilters`, which also filters the prebuilt jniLibs below).
      # Compression and R8: apps/mobile/app/plugins/withAndroidReleaseSize.js.
      GHOSTEX_ANDROID_ABIS: ${{ inputs.distribution == 'play' && 'arm64-v8a x86_64' || 'arm64-v8a' }}
      # tooling/release-mobile/android.sh: `github` builds ghostex-android.apk into
      # build/release-gpui/<version>/android, `play` builds ghostex-android-play.aab into
      # build/release-gpui/<version>/android-play. Artifact names follow the folder, so the
      # GitHub release keeps reading `release-android`.
      GHOSTEX_ANDROID_DISTRIBUTION: ${{ inputs.distribution }}
      ANDROID_RELEASE_PLATFORM: ${{ inputs.distribution == 'play' && 'android-play' || 'android' }}
      ANDROID_RELEASE_FILE: ${{ inputs.distribution == 'play' && 'ghostex-android-play.aab' || 'ghostex-android.apk' }}
    steps:
      - name: Check the distribution
        run: |
          case "$GHOSTEX_ANDROID_DISTRIBUTION" in
          github | play) ;;
          *) echo "::error::distribution must be github or play, got $GHOSTEX_ANDROID_DISTRIBUTION"; exit 1 ;;
          esac
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - name: Restore pinned React Native sources
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_DEPLOY_KEY: ${{ secrets.GHOSTEX_MOBILE_DEPLOY_KEY }}
        run: |
          test -n "$MOBILE_DEPLOY_KEY"
          mkdir -p "$RUNNER_TEMP/mobile-ssh"
          printf '%s\n' "$MOBILE_DEPLOY_KEY" > "$RUNNER_TEMP/mobile-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/mobile-ssh/id_ed25519"
          gh api meta --jq '.ssh_keys[]' | sed 's/^/github.com /' > "$RUNNER_TEMP/mobile-ssh/known_hosts"
          git config submodule.mobile.url git@github.com:maddada/ghostex-mobile.git
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/mobile-ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/mobile-ssh/known_hosts" \
            git submodule update --init --depth 1 apps/mobile/app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17.0.19+10'
      - name: Install pinned Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865"
          # The cache keys below name the NDK through ANDROID_NDK_VERSION; a pin
          # bump that forgets the job env would otherwise serve a stale bridge.
          test -d "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
      # The tailcat gomobile bridge is build output, so it is deliberately not in
      # git (four ~35 MB libgojni.so files). It is generated here from the
      # committed Go source, after the submodule checkout that creates its
      # destination and after the NDK install that gomobile needs, and before the
      # Gradle build that compiles GhostexSshConnection.kt against it.
      #
      # CDXC:Release 2026-09-16 WHY: the 9.6.0 run spent 4 minutes in this step
      # on every release although its inputs (the Go sources, go.mod/go.sum, the
      # gomobile pin, the Go toolchain, the NDK) rarely change. The staged output
      # is therefore cached on exactly those inputs; on a hit the Go toolchain is
      # not even installed. A miss rebuilds from source exactly as before.
      - name: Restore the tailcat gomobile bridge
        id: tailcat_bridge_cache
        uses: actions/cache@v6
        with:
          path: |
            apps/mobile/app/modules/ghostex-native/android/libs/tailcatbridge.jar
            apps/mobile/app/modules/ghostex-native/android/src/main/jniLibs
          key: tailcat-bridge-android-${{ runner.os }}-go1.27.1-ndk${{ env.ANDROID_NDK_VERSION }}-gomobile-${{ env.GOMOBILE_PIN }}-${{ hashFiles('apps/mobile/tailcat-bridge/*.go', 'apps/mobile/tailcat-bridge/go.mod', 'apps/mobile/tailcat-bridge/go.sum', 'apps/mobile/tailcat-bridge/build.sh') }}
      - uses: actions/setup-go@v6
        if: steps.tailcat_bridge_cache.outputs.cache-hit != 'true'
        with:
          go-version: '1.27.1'
          cache-dependency-path: apps/mobile/tailcat-bridge/go.sum
      - name: Build the tailcat gomobile bridge
        if: steps.tailcat_bridge_cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install "golang.org/x/mobile/cmd/gomobile@$GOMOBILE_PIN" "golang.org/x/mobile/cmd/gobind@$GOMOBILE_PIN"
          gomobile init
          apps/mobile/tailcat-bridge/build.sh --target android
      - name: Verify the tailcat gomobile bridge
        run: |
          MODULE=apps/mobile/app/modules/ghostex-native/android
          test -s "$MODULE/libs/tailcatbridge.jar"
          for abi in $GHOSTEX_ANDROID_ABIS; do
            test -s "$MODULE/src/main/jniLibs/$abi/libgojni.so"
          done
      # The chat core as WebAssembly for the app's hidden WebView (the phone's chat brain), cached
      # on exactly its inputs (tooling/release-mobile/chat-core-page.sh pins binaryen). Metro bundles
      # the page into the app and into the over-the-air update.
      - name: Restore the chat core page
        id: chat_core_page_cache
        uses: actions/cache@v6
        with:
          path: apps/mobile/app/assets/chat-core/chat-core.html
          key: chat-core-page-${{ runner.os }}-${{ hashFiles('packages/gx-chat-wasm/src/**', 'packages/gx-chat-wasm/page/**', 'packages/gx-chat-wasm/Cargo.*', 'packages/gx-chat-wasm/rust-toolchain.toml', 'packages/gx-chat-json/**', 'packages/gx-chat-core/**', 'packages/gx-protocol/**', 'packages/gx-visual/**', 'tooling/xtask/src/mobile_chat_wasm.rs', 'tooling/release-mobile/chat-core-page.sh') }}
      # CDXC:ReleaseKache 2026-11-04: the page build compiles Rust, so it goes through kache like every Rust build. No store is persisted: the page itself is cached on its inputs above, so this only runs on a page cache miss.
      - name: Install kache
        if: steps.chat_core_page_cache.outputs.cache-hit != 'true'
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed
        with:
          version: v2.0.0
          github-cache: 'false'
          pr-comment: 'false'
      - name: Build the chat core page
        if: steps.chat_core_page_cache.outputs.cache-hit != 'true'
        run: tooling/release-mobile/chat-core-page.sh
      - name: Verify the chat core page
        run: test -s apps/mobile/app/assets/chat-core/chat-core.html
      - name: Install repository dependencies
        # `tooling/release-mobile/android.sh` runs `generate-chat-agents.mjs`,
        # which imports esbuild from the ROOT node_modules. The React Native
        # install below is scoped to apps/mobile/app and does not provide it.
        run: tooling/release-gpui/retry.sh 3 5 -- bun install --frozen-lockfile
      - name: Install React Native dependencies
        working-directory: apps/mobile/app
        run: bun install --frozen-lockfile
      # CDXC:Release 2026-09-16 WHY: the 9.6.0 Gradle step took 22 minutes with
      # every one of its 911 tasks executed. About 18 of those minutes were NDK
      # C++ compilation (expo-modules-core, reanimated, worklets, screens,
      # gesture-handler, and the app's own autolinking glue, each for four ABIs),
      # which Gradle's build cache cannot cover because AGP's CMake tasks are not
      # cacheable. ccache in front of the NDK clang covers exactly that part and
      # is what React Native itself documents for CI. The Gradle build cache
      # (~/.gradle/caches/build-cache-1, inside the cached path) covers the rest:
      # the Kotlin compilation of the Expo and React Native Gradle plugins during
      # configuration, and the Kotlin/Java/dex work of every module.
      # The Gradle configuration cache is deliberately not enabled: it lives in
      # android/.gradle, which `expo prebuild` recreates on every run, and its
      # inputs include the release version and signing properties, so it would
      # never hit between releases.
      # Neither cache changes what the APK contains: ccache and the Gradle build
      # cache return the same bytes the compilers would produce for the same
      # inputs, and signing is untouched.
      - name: Restore Gradle build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: react-native-android-gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/app/bun.lock', 'apps/mobile/app/package.json') }}
          restore-keys: react-native-android-gradle-${{ runner.os }}-
      - name: Enable the Gradle build cache
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.caching=true\n' >> ~/.gradle/gradle.properties
      - name: Restore the NDK compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: react-native-android-ccache-${{ runner.os }}-ndk${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('apps/mobile/app/bun.lock', 'apps/mobile/app/package.json') }}
          restore-keys: react-native-android-ccache-${{ runner.os }}-ndk${{ env.ANDROID_NDK_VERSION }}-
      - name: Install ccache
        id: ccache
        run: |
          sudo apt-get install -y --no-install-recommends ccache \
            || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ccache; }
          ccache --zero-stats
      # The Play bundle checks read the bundle's manifest and signature and cut a universal APK
      # from it with bundletool (tooling/release-mobile/android.sh). The jar is pinned by checksum.
      - name: Install pinned bundletool
        if: ${{ inputs.distribution == 'play' }}
        env:
          BUNDLETOOL_VERSION: 1.18.3
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          JAR="$RUNNER_TEMP/bundletool-all-$BUNDLETOOL_VERSION.jar"
          tooling/release-gpui/retry.sh 3 5 -- curl -fsSL -o "$JAR" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $JAR" | sha256sum -c -
          echo "GHOSTEX_BUNDLETOOL_JAR=$JAR" >> "$GITHUB_ENV"
      - name: Restore external Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ghostex-release.jks"
          chmod 600 "$RUNNER_TEMP/ghostex-release.jks"
      - name: Build and verify signed Android release
        env:
          GHOSTEX_ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/ghostex-release.jks
          GHOSTEX_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          GHOSTEX_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          GHOSTEX_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          GHOSTEX_RELEASE_SOURCE_SHA: ${{ github.sha }}
          # CMake (>= 3.17) reads these to prefix every NDK clang invocation
          # with ccache; AGP inherits the Gradle daemon's environment. The
          # compiler is identified by its version string rather than the
          # default mtime because sdkmanager installs the NDK afresh on every
          # runner; the sloppiness flags let a fresh checkout's header
          # timestamps hit entries written by an earlier run.
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_COMPILERCHECK: '%compiler% --version'
          CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros
          CCACHE_MAXSIZE: 2G
        run: tooling/release-gpui/android.sh "${{ inputs.version }}"
      # The same release's JavaScript as an over-the-air update for Android and iOS phones whose
      # app has the same native code (tooling/release-mobile/ota-server/README.md). The GitHub
      # release's publish_ota job signs and uploads it once the release is out; the Play bundle
      # has its own runtime version and publishes nothing yet.
      - name: Export the over-the-air update
        if: ${{ inputs.distribution != 'play' }}
        run: tooling/release-mobile/ota-export.sh "${{ inputs.version }}" "build/release-gpui/${{ inputs.version }}/ota"
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.distribution != 'play' }}
        with:
          name: ota-bundles
          path: build/release-gpui/${{ inputs.version }}/ota/
          if-no-files-found: error
          retention-days: 14
      - name: Report ccache statistics
        if: ${{ always() && steps.ccache.conclusion == 'success' }}
        run: ccache --show-stats
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/release-gpui/${{ inputs.version }}/${{ env.ANDROID_RELEASE_PLATFORM }}/${{ env.ANDROID_RELEASE_FILE }}
      # The R8 mapping turns obfuscated stack traces from phones back into
      # source names. It stays a workflow artifact, never a release asset.
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.ANDROID_RELEASE_PLATFORM }}-r8-mapping
          path: build/release-gpui/${{ inputs.version }}/${{ env.ANDROID_RELEASE_PLATFORM }}-r8/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.ANDROID_RELEASE_PLATFORM }}
          path: build/release-gpui/${{ inputs.version }}/${{ env.ANDROID_RELEASE_PLATFORM }}/
          if-no-files-found: error
          retention-days: ${{ inputs.distribution == 'play' && 90 || 14 }}
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.plan != '' }}
        with:
          name: release-provenance-android
          path: build/release-gpui/${{ inputs.version }}/android/provenance.json
          if-no-files-found: error
          retention-days: 14
