name: GPUI release - Android

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      ANDROID_RELEASE_KEYSTORE_BASE64:
        required: true
      ANDROID_RELEASE_STORE_PASSWORD:
        required: true
      ANDROID_RELEASE_KEY_ALIAS:
        required: true
      ANDROID_RELEASE_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Restore Android release sources
        run: git submodule update --init --depth 1 android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Restore external Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ghostex-release.jks"
          chmod 600 "$RUNNER_TEMP/ghostex-release.jks"
      - name: Build and verify signed APK
        env:
          GHOSTEX_ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/ghostex-release.jks
          GHOSTEX_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          GHOSTEX_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          GHOSTEX_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: scripts/release-gpui/android.sh "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: build/release-gpui/${{ inputs.version }}/android/
          if-no-files-found: error
          retention-days: 14
