name: Release build - gxserver Linux x64

on:
  workflow_dispatch:
    inputs:
      version: { description: "Semver release version", required: true, type: string }
      source_sha: { description: "Immutable application source commit", required: true, type: string }
      channel: { description: "Release channel", required: true, default: stable, type: choice, options: [stable, prerelease, test] }
      update_sparkle: { description: "Whether assembly may eventually update Sparkle", required: true, default: true, type: boolean }
      prerequisite_run_id: { description: "Optional prerequisite workflow run", required: false, type: string }

permissions: { actions: write, contents: write }

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: "${{ inputs.source_sha }}", fetch-depth: 0, submodules: false }
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: main, path: .release-automation, fetch-depth: 1, submodules: false }
      - name: Verify immutable source
        run: |
          node .release-automation/scripts/release-resumable.mjs validate-source "${{ inputs.version }}" "${{ inputs.source_sha }}"
          echo "GHOSTEX_RELEASE_WORKFLOW_SHA=$(git -C .release-automation rev-parse HEAD)" >> "$GITHUB_ENV"
          printf '/.release-automation/\n' >> .git/info/exclude
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.4.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.13.1 }
      - name: Install pinned build toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            build-essential \
            cmake=3.28.3-1build7 \
            jq \
            libkrb5-dev \
            libx11-dev \
            libxkbfile-dev \
            ninja-build=1.11.1-2 \
            pkg-config=1.8.1-2build1 \
            python3 \
            rsync
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          curl -fsSL https://mise.run | MISE_VERSION=2026.7.7 sh
          "$HOME/.local/bin/mise" install zig@0.16.0
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - run: bun install --frozen-lockfile
      - name: Prepare source dependencies
        env: { GHOSTEX_RELEASE_REPO_ROOT: "${{ github.workspace }}" }
        run: GHOSTEX_RELEASE_SKIP_GPUI_REFERENCES=1 .release-automation/scripts/release-gpui/prepare-references.sh
      - name: Resolve immutable code-server component identity
        id: code_server_identity
        run: node .release-automation/scripts/release-gpui/code-server-component-identity.mjs --root .dependencies/code-server --platform linux-x64 --github-output >> "$GITHUB_OUTPUT"
      - name: Build gxserver Linux x64
        env:
          GHOSTEX_RELEASE_AUTOMATION_ROOT: ${{ github.workspace }}/.release-automation
          GHOSTEX_RELEASE_REPO_ROOT: ${{ github.workspace }}
          GHOSTEX_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          GHOSTEX_REQUIRE_BEADS_SMOKE: "1"
        run: |
          .release-automation/scripts/build-remote-gxserver-linux-release.sh --arch x64
          OUTPUT="build/release-gpui/${{ inputs.version }}/gxserver-linux-x64"
          mkdir -p "$OUTPUT"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C build/remote-gxserver-linux/x64/package -czf "$OUTPUT/gxserver-linux-x64.tar.gz" .
          source .release-automation/scripts/release-gpui/common.sh
          release_gpui_write_manifest "$OUTPUT" gxserver-linux-x64 "${{ inputs.version }}" "$OUTPUT/gxserver-linux-x64.tar.gz"
      - name: Apply Ghostex code-server build patches
        run: |
          PATCH="$PWD/.release-automation/scripts/release-gpui/patches/code-server-ripgrep-target-validation.patch"
          git -C .dependencies/code-server apply --check "$PATCH"
          git -C .dependencies/code-server apply "$PATCH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .dependencies/code-server/.node-version
          cache: npm
          cache-dependency-path: |
            .dependencies/code-server/package-lock.json
            .dependencies/code-server/lib/vscode/package-lock.json
      - name: Build code-server Linux x64 prerequisite
        run: |
          npm --prefix .dependencies/code-server ci
          (
            cd .dependencies/code-server
            npm run build
            OS=linux ARCH=amd64 VSCODE_TARGET=linux-x64 VERSION="$(node -p 'require("./package.json").version')" npm run build:vscode
            KEEP_MODULES=1 OS=linux ARCH=amd64 VSCODE_TARGET=linux-x64 npm run release
          )
          for required_entry in \
            lib/node \
            out/node/entry.js \
            out/node/routes/health.js \
            lib/vscode/out/server-main.js \
            lib/vscode/extensions/git/node_modules/@vscode/fs-copyfile/package.json \
            lib/vscode/node_modules/@vscode/ripgrep/bin/rg \
            lib/vscode/node_modules/node-pty/build/Release/pty.node; do
            [[ -f ".dependencies/code-server/release/$required_entry" ]] || { echo "Linux x64 code-server runtime is missing $required_entry" >&2; exit 1; }
          done
          test -x .dependencies/code-server/release/lib/node
          test -x .dependencies/code-server/release/lib/vscode/node_modules/@vscode/ripgrep/bin/rg
          grep -F promptEditorIpcReady .dependencies/code-server/release/out/node/routes/health.js >/dev/null
          .dependencies/code-server/release/lib/node .dependencies/code-server/release/out/node/entry.js --version >/dev/null
          OUTPUT="build/release-gpui/${{ inputs.version }}/code-server-linux-x64"
          ARCHIVE="$OUTPUT/${{ steps.code_server_identity.outputs.archive_name }}"
          mkdir -p "$OUTPUT"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C .dependencies/code-server/release -czf "$ARCHIVE" .
          archive_sha256="$(sha256sum "$ARCHIVE" | awk '{ print $1 }')"
          printf '%s  %s\n' "$archive_sha256" "$(basename "$ARCHIVE")" > "$ARCHIVE.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.version }}-${{ inputs.source_sha }}-gxserver-linux-x64
          path: build/release-gpui/${{ inputs.version }}/gxserver-linux-x64/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.code_server_identity.outputs.artifact_name }}
          path: build/release-gpui/${{ inputs.version }}/code-server-linux-x64/
          if-no-files-found: error
          retention-days: 90
  stage:
    needs: build
    runs-on: ubuntu-24.04
    concurrency: { group: "release-state-${{ inputs.version }}", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.13.1 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: "${{ inputs.version }}-${{ inputs.source_sha }}-gxserver-linux-x64", path: build/stage/gxserver }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: node scripts/release-resumable.mjs stage-package-and-advance "${{ inputs.version }}" "${{ inputs.source_sha }}" gxserver-linux-x64 build/stage/gxserver "$(git rev-parse HEAD)" "${{ inputs.channel }}" "${{ inputs.update_sparkle }}"
