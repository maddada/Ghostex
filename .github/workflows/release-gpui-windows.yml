name: GPUI release - Windows

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      arch:
        required: true
        type: string
      sign:
        required: false
        default: false
        type: boolean
      runtime_artifacts_ready:
        required: false
        default: false
        type: boolean
      code_server_component_version:
        required: false
        default: ''
        type: string
      code_server_archive_name:
        required: false
        default: ''
        type: string
      code_server_artifact_name:
        required: false
        default: ''
        type: string
    secrets:
      WINDOWS_CODE_SIGN_PFX_BASE64:
        required: false
      WINDOWS_CODE_SIGN_PFX_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version
        required: true
        type: string
      arch:
        description: Windows architecture
        required: true
        default: x64
        type: choice
        options: [x64, arm64]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.arch == 'arm64' && 'windows-11-vs2026-arm' || 'windows-2025' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Restore code-server source identity input
        if: ${{ !inputs.runtime_artifacts_ready }}
        run: git submodule update --init --depth=1 -- code-server
      - name: Resolve immutable code-server component identity
        if: ${{ !inputs.runtime_artifacts_ready }}
        id: code_server_identity
        shell: bash
        run: node scripts/release-gpui/code-server-component-identity.mjs --root code-server --platform "linux-${{ inputs.arch }}" --github-output >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: ${{ inputs.runtime_artifacts_ready }}
        with:
          name: release-gxserver-linux-${{ inputs.arch }}
          path: build/runtime-artifacts/${{ inputs.arch }}
      - uses: actions/download-artifact@v8
        if: ${{ inputs.runtime_artifacts_ready }}
        with:
          name: ${{ inputs.code_server_artifact_name }}
          path: build/runtime-artifacts/${{ inputs.arch }}
      - name: Install pinned Zig
        shell: pwsh
        run: scripts/release-gpui/prepare-zig.ps1 -Arch "${{ inputs.arch }}"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Install pinned Velopack CLI
        shell: pwsh
        run: dotnet tool install --global vpk --version 1.2.0
      - name: Install JavaScript dependencies
        shell: pwsh
        run: bun install --frozen-lockfile
      - name: Restore Windows code-signing certificate
        if: ${{ inputs.sign }}
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGN_PFX_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\ghostex-code-signing.pfx", [Convert]::FromBase64String($env:PFX_BASE64))
      - name: Build installer and portable package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GHOSTEX_WINDOWS_SIGNING_PFX: ${{ runner.temp }}\ghostex-code-signing.pfx
          GHOSTEX_WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_PFX_PASSWORD }}
          GHOSTEX_WINDOWS_REQUIRE_SIGNING: ${{ inputs.sign && '1' || '0' }}
          GHOSTEX_WINDOWS_REQUIRE_WSL_RUNTIME: ${{ inputs.runtime_artifacts_ready && '1' || '0' }}
          GHOSTEX_WINDOWS_WSL_GXSERVER_ARCHIVE: ${{ github.workspace }}\build\runtime-artifacts\${{ inputs.arch }}\gxserver-linux-${{ inputs.arch }}.tar.gz
          GHOSTEX_CODE_SERVER_COMPONENT_VERSION: ${{ inputs.code_server_component_version || steps.code_server_identity.outputs.component_version }}
          GHOSTEX_WINDOWS_WSL_CODE_SERVER_ARCHIVE: ${{ github.workspace }}\build\runtime-artifacts\${{ inputs.arch }}\${{ inputs.code_server_archive_name || steps.code_server_identity.outputs.archive_name }}
        run: scripts/release-gpui/windows.ps1 -Version "${{ inputs.version }}" -Arch "${{ inputs.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ inputs.arch }}
          path: build/release-gpui/${{ inputs.version }}/windows-${{ inputs.arch }}/
          if-no-files-found: error
          retention-days: 14
