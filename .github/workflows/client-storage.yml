name: Managed client storage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  storage-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun tooling/client-storage/check.mjs
