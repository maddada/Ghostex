name: GPUI release - publish

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      expected_platforms:
        required: true
        type: string
      prerelease:
        required: false
        default: false
        type: boolean
      update_sparkle:
        required: false
        default: true
        type: boolean
      windows_signed:
        required: false
        default: true
        type: boolean
      source_run_id:
        required: false
        default: ''
        type: string
      plan:
        description: Resolved release plan JSON from the prepare job
        required: false
        default: ''
        type: string
      amend:
        description: Merge into an existing public release instead of creating a tag
        required: false
        default: false
        type: boolean
      amend_products:
        description: Comma-separated product ids this amend is allowed to add or replace
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version
        required: true
        type: string
      expected_platforms:
        description: Comma-separated platform manifest names
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: false
        default: true
        type: boolean
      update_sparkle:
        description: Commit and publish the Sparkle appcast
        required: false
        default: false
        type: boolean
      windows_signed:
        description: Windows artifacts are Authenticode-signed
        required: false
        default: false
        type: boolean
      source_run_id:
        description: Completed release workflow run containing all artifacts
        required: true
        type: string
      plan:
        description: >-
          Resolved release plan JSON recorded by the source run. Leave empty to
          use the run's own release-plan artifact.
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: ghostex-gpui-publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/download-artifact@v8
        if: ${{ inputs.source_run_id == '' }}
        with:
          path: build/release-gpui/workflow-artifacts
      - uses: actions/download-artifact@v8
        if: ${{ inputs.source_run_id != '' }}
        with:
          path: build/release-gpui/workflow-artifacts
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Validate and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GHOSTEX_RELEASE_EXPECTED_PLATFORMS: ${{ inputs.expected_platforms }}
          # CDXC:ReleaseChangeAwarePlanning 2026-08-13: the resolved plan decides
          # what this release contains. assemble.mjs cross-checks plan <->
          # manifest <-> provenance for every product, emits
          # release-provenance-<version>.json, and refuses a mixed set. When this
          # input is empty the run's own `release-plan` artifact is used, and when
          # both exist they must agree exactly.
          GHOSTEX_RELEASE_PLAN: ${{ inputs.plan }}
          # Every freshly built artifact in the set must come from one Actions
          # run: this one, or the nominated source run of a publish-only
          # recovery. Reused artifacts legitimately name a foreign origin run.
          GHOSTEX_RELEASE_SOURCE_RUN_ID: ${{ inputs.source_run_id != '' && inputs.source_run_id || github.run_id }}
          GHOSTEX_RELEASE_PRERELEASE: ${{ inputs.prerelease && '1' || '0' }}
          GHOSTEX_RELEASE_UPDATE_SPARKLE: ${{ inputs.update_sparkle && '1' || '0' }}
          GHOSTEX_RELEASE_WINDOWS_SIGNED: ${{ inputs.windows_signed && '1' || '0' }}
          GHOSTEX_RELEASE_AMEND_PRODUCTS: ${{ inputs.amend_products }}
        run: >-
          node tooling/release-gpui/${{ inputs.amend && 'amend-existing.mjs' || 'assemble.mjs' }}
          "${{ inputs.version }}"
          build/release-gpui/workflow-artifacts
      # The vendor-maintained `ghostex-bin` AUR package tracks the portable
      # Linux tarball of the release that was just published. Its template,
      # scriptlet, and the one-time AUR account setup live in
      # tooling/packaging/aur/ghostex-bin/. This never runs for a prerelease: Arch users
      # follow stable releases only.
      - name: Decide whether the ghostex-bin AUR package can be updated
        id: aur_gate
        if: ${{ !inputs.prerelease }}
        env:
          # `if:` conditions cannot read `secrets`, so secret availability is
          # resolved into a step output here and gates the step below instead.
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "AUR_SSH_PRIVATE_KEY is not configured; skipping the ghostex-bin AUR update."
            echo "See tooling/packaging/aur/ghostex-bin/README.md for the one-time setup."
            echo 'publish=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          asset="ghostex-${VERSION}-linux-x64.tar.zst"
          if ! gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --json assets \
            --jq '.assets[].name' | grep -qxF "${asset}"; then
            echo "v${VERSION} publishes no ${asset}; skipping the ghostex-bin AUR update."
            echo 'publish=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # A publish-only recovery or an amend may target an older release. The
          # AUR carries exactly one version, so pushing one of those would
          # silently downgrade every Arch user.
          latest="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq '.tagName')"
          if [ "${latest}" != "v${VERSION}" ]; then
            echo "v${VERSION} is not the latest release (${latest}); skipping the ghostex-bin AUR update."
            echo 'publish=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Updating the ghostex-bin AUR package to ${VERSION}."
          echo 'publish=true' >>"$GITHUB_OUTPUT"
      - name: Update the ghostex-bin AUR package
        if: ${{ steps.aur_gate.outputs.publish == 'true' }}
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" >"$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          # Pinned rather than ssh-keyscan'd: a blind keyscan trusts whatever
          # answers on port 22 the first time. These are the aur.archlinux.org
          # host keys published in archlinux/infrastructure docs/ssh-hostkeys.txt:
          #   ECDSA   SHA256:uTa/0PndEgPZTf76e1DFqXKJEXKsn7m9ivhLQtzGOCI
          #   ED25519 SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          #   RSA     SHA256:5s5cIyReIfNNVGRFdDbe3hdYiI5OelHGpw2rOUud3Q8
          cat >"$HOME/.ssh/aur_known_hosts" <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          aur.archlinux.org ssh-rsa 
          EOF
          chmod 600 "$HOME/.ssh/aur_known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/aur_known_hosts"
          # Prefer the checksum the producing job already recorded. When the
          # tarball product was reused rather than rebuilt there is no manifest
          # in this workspace, and the publisher falls back to the published
          # asset's own digest.
          manifest="build/release-gpui/workflow-artifacts/release-linux-tar-x64/manifest.json"
          manifest_argument=()
          if [ -f "${manifest}" ]; then manifest_argument=(--manifest "${manifest}"); fi
          node tooling/release-gpui/publish-aur.mjs \
            --version "${VERSION}" "${manifest_argument[@]}" --publish
