name: Release assemble

on:
  workflow_dispatch:
    inputs:
      version: { description: 'Semver release version', required: true, type: string }
      source_sha: { description: 'Immutable application source commit', required: true, type: string }
      channel:
        {
          description: 'Release channel',
          required: false,
          default: stable,
          type: choice,
          options: [stable, prerelease, test],
        }
      update_sparkle: { description: 'Publish production Sparkle last', required: true, default: true, type: boolean }
      prerequisite_run_id: { description: 'Optional prerequisite workflow run', required: false, type: string }

permissions:
  actions: read
  contents: write

concurrency:
  group: release-assemble-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: main, fetch-depth: 0, submodules: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.4.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.13.1 }
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with: { distribution: temurin, java-version: '17.0.19+10' }
      - name: Install pinned Android verifier
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
      - name: Verify staged allowlist, publish GitHub, then publish Sparkle
        env:
          GH_TOKEN: ${{ github.token }}
          GHOSTEX_RELEASE_UPDATE_SPARKLE: ${{ inputs.update_sparkle && '1' || '0' }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: node tooling/release-assemble-resumable.mjs "${{ inputs.version }}" "${{ inputs.source_sha }}"
