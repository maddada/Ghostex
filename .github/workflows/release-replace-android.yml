name: Replace released React Native Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable release version whose Android APK should be replaced
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: ghostex-replace-android-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - name: Validate immutable replacement inputs
        env:
          GHOSTEX_RELEASE_ANDROID: "true"
          GHOSTEX_RELEASE_ALLOW_EXISTING_TAG: "1"
          GHOSTEX_RELEASE_UPDATE_SPARKLE: "false"
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          GHOSTEX_MOBILE_DEPLOY_KEY: ${{ secrets.GHOSTEX_MOBILE_DEPLOY_KEY }}
        run: node tooling/release-gpui/preflight.mjs "${{ inputs.version }}"

  build:
    needs: validate
    uses: ./.github/workflows/release-gpui-android.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  replace:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/download-artifact@v8
        with:
          name: release-android
          path: build/release-gpui/android-replacement
      - name: Replace only the released React Native APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node tooling/release-gpui/replace-android.mjs
          "${{ inputs.version }}"
          build/release-gpui/android-replacement
