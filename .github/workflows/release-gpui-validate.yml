name: GPUI release - Windows compile validation

# CDXC:WindowsValidationIsNotAGate 2026-09-01 (supersedes the gate half of
# CDXC:ReleaseChangeAwarePlanning 2026-08-13):
#
# THIS IS NO LONGER A GATE. Neither release-gpui.yml nor
# release-amend-existing.yml calls it, no job in a release or amend run needs
# it, and the release operator runbook no longer requires a standalone run
# before dispatch. It is an OPT-IN check.
#
# Why it stopped being worth gating with. Measured on 8.4.0 (run 33358931668):
# this workflow took 23m04s, windows_x64 took 22m37s and windows_arm64 23m59s,
# and the packaging jobs started 4 seconds after this one finished. It cost as
# much as the thing it gated, to learn about one minute early exactly what
# `cargo build` in the Windows jobs reports anyway. Its only real saving was
# the runner-minutes of one duplicated Windows job on a release that fails to
# compile on Windows, and `--reuse-from-run` already made that recovery cheap:
# a redispatch reuses every product that already succeeded and rebuilds only
# the failed one.
#
# When to still run it, by hand, from the Actions tab (or
# `node tooling/release-validate-windows.mjs`): a cycle with heavy
# Windows-conditional Rust churn — `#[cfg(windows)]` / `#[cfg(target_os =
# "windows")]` bodies, new Windows-only crates or FFI, or a Cargo.lock bump
# that moves a Windows-only dependency. That is the churn where a Windows
# compile error is likely *and* would not have been caught by the macOS/Linux
# jobs or by `bun run typecheck`.
#
# It still checks one thing nothing else in the release pipeline compiles: the
# gxserver tree targeting Windows. The Windows packaging jobs only build
# apps/desktop; Windows ships gxserver through WSL as a Linux binary.
#
# What it type-checks that `bun run typecheck` cannot see: cfg-gated Windows
# code paths, on both x64 and ARM64.
#
# Deliberately NOT a source of build outputs (§Q7). `cargo check` emits .rmeta
# that `cargo build` cannot link, so any "validation feeds packaging" scheme
# would be a lie or a second full build. The only handoff is warm dependency
# caches: ~/.cargo/registry, ~/.cargo/git, apps/desktop/target, the CEF cache, and the
# Zig global cache. Do not "optimize" this into an artifact handoff.
#
# Risk R6: the ARM64 leg cross-compiles from windows-2025. If the ARM64 CEF
# distribution, `rc.exe` discovery, or the Zig aarch64-windows cross build ever
# stops working on that image, dispatch this workflow twice instead — once with
# `arm64_target: false`, and once with `runner: windows-11-vs2026-arm`. Do not
# simply drop the ARM64 check: it is the exact failure that motivated this job.
#
# The `workflow_call` trigger is retained so this can be wired into a
# non-release context (for example a Windows-touching PR check) without
# reshaping the file. It must NOT be re-added as a `needs:` of windows_x64,
# windows_arm64, or publish in release-gpui.yml or release-amend-existing.yml;
# that is the arrangement the 8.4.0 measurements above rejected. It is also a
# correctness trap: a conditionally-run gate that ends up skipped skips its
# dependents, so the Windows packages silently never build.

on:
  workflow_call:
    inputs:
      arm64_target:
        description: Also cross-check the aarch64-pc-windows-msvc target
        required: false
        default: true
        type: boolean
      runner:
        description: Runner label to validate on
        required: false
        default: windows-2025
        type: string
  workflow_dispatch:
    inputs:
      arm64_target:
        description: Also cross-check the aarch64-pc-windows-msvc target
        required: false
        default: true
        type: boolean
      runner:
        description: Runner label to validate on
        required: false
        default: windows-2025
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      CEF_PATH: ${{ github.workspace }}\gpui\build\cef-cache
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\build\zig-global-cache
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - name: Resolve dependency cache keys
        id: cache_keys
        shell: bash
        run: |
          {
            printf 'cef=%s\n' "$(git rev-parse HEAD:.dependencies/cef-rs)"
            printf 'zig=%s\n' "$(git rev-parse HEAD:.dependencies/ghostty)"
          } >> "$GITHUB_OUTPUT"
      - name: Restore Cargo registry cache
        uses: actions/cache@v6
        id: cargo_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-reg-windows-${{ hashFiles('apps/desktop/Cargo.lock', 'server/Cargo.lock') }}
          restore-keys: cargo-reg-windows-
      - name: Restore CEF distribution cache
        uses: actions/cache@v6
        id: cef_cache
        with:
          path: apps/desktop/build/cef-cache
          key: cef-windows-${{ steps.cache_keys.outputs.cef }}
      - name: Restore Zig package cache
        uses: actions/cache@v6
        id: zig_cache
        with:
          path: build/zig-global-cache
          key: zig-windows-${{ steps.cache_keys.outputs.zig }}
          restore-keys: zig-windows-
      - name: Restore Cargo check target cache
        uses: actions/cache@v6
        id: target_cache
        with:
          path: apps/desktop/target
          key: cargo-check-windows-${{ hashFiles('apps/desktop/Cargo.lock') }}-${{ steps.cache_keys.outputs.cef }}
          restore-keys: cargo-check-windows-${{ hashFiles('apps/desktop/Cargo.lock') }}-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install pinned Zig
        shell: pwsh
        run: tooling/release-gpui/prepare-zig.ps1 -Arch x64
      - name: Install the ARM64 Rust target
        if: ${{ inputs.arm64_target }}
        shell: bash
        run: tooling/release-gpui/retry.sh 3 5 -- rustup target add aarch64-pc-windows-msvc
      - name: Install JavaScript dependencies
        shell: bash
        run: tooling/release-gpui/retry.sh 3 5 -- bun install --frozen-lockfile
      - name: Prepare pinned reference checkouts
        shell: bash
        env:
          GHOSTEX_RELEASE_SKIP_SUBMODULES: '1'
        run: tooling/release-gpui/prepare-references.sh
      # No fetch-zig-deps.sh here: ZIG_GLOBAL_CACHE_DIR must stay a native
      # Windows path, which the bash prefetch helper cannot produce. The
      # restored Zig package cache serves the same purpose on this runner.
      - name: Type-check the Windows x64 desktop tree
        shell: bash
        run: cargo check --locked --all-targets --manifest-path apps/desktop/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Type-check the Windows ARM64 desktop tree
        if: ${{ inputs.arm64_target }}
        shell: bash
        run: cargo check --locked --all-targets --manifest-path apps/desktop/Cargo.toml --target aarch64-pc-windows-msvc
      - name: Type-check the Windows gxserver tree
        shell: bash
        run: cargo check --locked --all-targets --manifest-path server/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Record job observability
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### Windows compile validation"
            echo ""
            echo "- Cargo registry cache: ${{ steps.cargo_cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
            echo "- CEF distribution cache: ${{ steps.cef_cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
            echo "- Zig package cache: ${{ steps.zig_cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
            echo "- cargo check target cache: ${{ steps.target_cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
            echo "- ARM64 target checked: ${{ inputs.arm64_target }}"
          } >> "$GITHUB_STEP_SUMMARY"
