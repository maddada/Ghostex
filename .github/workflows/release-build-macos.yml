name: Release build - macOS arm64

on:
  workflow_dispatch:
    inputs:
      version: { description: "Semver release version", required: true, type: string }
      source_sha: { description: "Immutable application source commit", required: true, type: string }
      channel: { description: "Release channel", required: true, default: stable, type: choice, options: [stable, prerelease, test] }
      update_sparkle: { description: "Generate production Sparkle metadata for later assembly", required: true, default: true, type: boolean }
      macos_stage: { description: "Run the full flow or one resumable stage", required: true, default: all, type: choice, options: [all, build-sign, submit, poll-staple] }
      gxserver_x64_run_id: { description: "Optional successful gxserver x64 run", required: false, type: string }
      gxserver_arm64_run_id: { description: "Optional successful gxserver ARM64 run", required: false, type: string }
      prerequisite_run_id: { description: "Run containing the preserved signed DMG", required: false, type: string }
      submission_id: { description: "Existing Apple submission ID", required: false, type: string }

permissions:
  actions: write
  contents: write

jobs:
  ghosttykit:
    if: ${{ inputs.macos_stage == 'all' || inputs.macos_stage == 'build-sign' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: "${{ inputs.source_sha }}", fetch-depth: 0, submodules: false }
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: main, path: .release-automation, fetch-depth: 1, submodules: false }
      - name: Verify immutable source
        run: |
          node .release-automation/scripts/release-resumable.mjs validate-source "${{ inputs.version }}" "${{ inputs.source_sha }}"
          echo "GHOSTEX_RELEASE_WORKFLOW_SHA=$(git -C .release-automation rev-parse HEAD)" >> "$GITHUB_ENV"
          printf '/.release-automation/\n' >> .git/info/exclude
      - name: Install pinned Ghostty toolchain
        run: |
          curl -fsSL https://mise.run | MISE_VERSION=2026.7.7 sh
          "$HOME/.local/bin/mise" use -g \
            cmake@4.4.0 \
            ninja@1.13.2 \
            xcodegen@2.46.0
          "$HOME/.local/bin/mise" install zig@0.16.0
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          echo "ZIG=$HOME/.local/share/mise/installs/zig/0.16.0/bin/zig" >> "$GITHUB_ENV"
      - name: Build GhosttyKit prerequisite
        env:
          GHOSTEX_RELEASE_REPO_ROOT: ${{ github.workspace }}
          GHOSTEX_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: .release-automation/scripts/release-gpui/macos-prerequisite.sh ghosttykit "build/macos-prerequisites/ghosttykit-${{ inputs.version }}-${{ inputs.source_sha }}.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.version }}-${{ inputs.source_sha }}-macos-ghosttykit
          path: build/macos-prerequisites/ghosttykit-${{ inputs.version }}-${{ inputs.source_sha }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  runtime:
    if: ${{ inputs.macos_stage == 'all' || inputs.macos_stage == 'build-sign' }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: "${{ inputs.source_sha }}", fetch-depth: 0, submodules: false }
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: main, path: .release-automation, fetch-depth: 1, submodules: false }
      - name: Verify immutable source
        run: |
          node .release-automation/scripts/release-resumable.mjs validate-source "${{ inputs.version }}" "${{ inputs.source_sha }}"
          echo "GHOSTEX_RELEASE_WORKFLOW_SHA=$(git -C .release-automation rev-parse HEAD)" >> "$GITHUB_ENV"
          printf '/.release-automation/\n' >> .git/info/exclude
      - name: Prepare pinned runtime references and submodules
        env:
          GHOSTEX_RELEASE_REPO_ROOT: ${{ github.workspace }}
        run: .release-automation/scripts/release-gpui/prepare-references.sh
      - name: Resolve immutable code-server component identity
        id: code_server_identity
        run: node .release-automation/scripts/release-gpui/code-server-component-identity.mjs --root .dependencies/code-server --platform linux-x64 --github-output >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.4.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22.22.1, cache: npm, cache-dependency-path: .dependencies/code-server/package-lock.json }
      - name: Verify staged remote runtime prerequisites
        env:
          GXSERVER_ARM64_RUN_ID: ${{ inputs.gxserver_arm64_run_id }}
          GXSERVER_X64_RUN_ID: ${{ inputs.gxserver_x64_run_id }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module - <<'JS'
          import { validateStagedRelease } from "./.release-automation/scripts/release-state-lib.mjs";
          const result = validateStagedRelease(process.env.VERSION, { sourceSha: process.env.SOURCE_SHA });
          for (const [name, runId] of [
            ["gxserver-linux-x64", process.env.GXSERVER_X64_RUN_ID],
            ["gxserver-linux-arm64", process.env.GXSERVER_ARM64_RUN_ID],
          ]) {
            if (!result.completed[name]) throw new Error(`Missing verified prerequisite ${name}`);
            if (!runId || String(result.completed[name].run_id) !== runId) {
              throw new Error(`${name} artifact run ${runId || "<missing>"} does not match verified release state run ${result.completed[name].run_id}`);
            }
          }
          JS
          mkdir -p build/runtime-artifacts/x64 build/runtime-artifacts/arm64
          gh release download "v${{ inputs.version }}" --repo maddada/Ghostex --pattern gxserver-linux-x64.tar.gz --dir build/runtime-artifacts/x64
          gh release download "v${{ inputs.version }}" --repo maddada/Ghostex --pattern gxserver-linux-arm64.tar.gz --dir build/runtime-artifacts/arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.code_server_identity.outputs.artifact_name }}
          path: build/runtime-artifacts/code-server-x64
          github-token: ${{ github.token }}
          repository: maddada/Ghostex
          run-id: ${{ inputs.gxserver_x64_run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-code-server-${{ steps.code_server_identity.outputs.component_version }}-linux-arm64
          path: build/runtime-artifacts/code-server-arm64
          github-token: ${{ github.token }}
          repository: maddada/Ghostex
          run-id: ${{ inputs.gxserver_arm64_run_id }}
      - name: Validate remote runtime archives
        run: |
          for tuple in \
            "x64 build/runtime-artifacts/code-server-x64/${{ steps.code_server_identity.outputs.archive_name }}" \
            "arm64 build/runtime-artifacts/code-server-arm64/code-server-${{ steps.code_server_identity.outputs.component_version }}-linux-arm64.tar.gz"; do
            set -- $tuple
            archive="$2"
            [[ -f "$archive" ]] || { echo "Missing required Linux $1 code-server archive: $archive" >&2; exit 1; }
            node .release-automation/scripts/release-gpui/verify-code-server-archive.mjs \
              --archive "$archive" \
              --version "${{ steps.code_server_identity.outputs.component_version }}" \
              --platform "linux-$1"
          done
          mkdir -p build/remote-gxserver-linux/x64/package build/remote-gxserver-linux/arm64/package
          tar -xzf build/runtime-artifacts/x64/gxserver-linux-x64.tar.gz -C build/remote-gxserver-linux/x64/package
          tar -xzf build/runtime-artifacts/arm64/gxserver-linux-arm64.tar.gz -C build/remote-gxserver-linux/arm64/package
          test -x build/remote-gxserver-linux/x64/package/bin/gxserver
          test -x build/remote-gxserver-linux/arm64/package/bin/gxserver
      - name: Install pinned runtime toolchains
        run: |
          brew install rsync
          rsync --version | head -n 1 | grep -F 'version 3.4.4'
          rustup toolchain install 1.95.0 --profile minimal
          curl -fsSL https://mise.run | MISE_VERSION=2026.7.7 sh
          "$HOME/.local/bin/mise" use -g \
            cmake@4.4.0 \
            go@1.26.5 \
            ninja@1.13.2 \
            xcodegen@2.46.0
          "$HOME/.local/bin/mise" install zig@0.16.0
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          printf 'ZIG=%s\nGHOSTEX_ZIG=%s\n' \
            "$HOME/.local/share/mise/installs/zig/0.16.0/bin/zig" \
            "$HOME/.local/share/mise/installs/zig/0.16.0/bin/zig" >> "$GITHUB_ENV"
      - name: Seed pinned VS Code ripgrep cache
        env:
          RIPGREP_PACKAGE_VERSION: 1.17.1
          RIPGREP_VERSION: v15.0.1
          RIPGREP_SHA256: 2fa16464fd8638588a67c7fc172d3c4b57fbdc65dff366e10b0b0e90734628a6
        run: |
          RIPGREP_ASSET="ripgrep-${RIPGREP_VERSION}-aarch64-apple-darwin.tar.gz"
          RIPGREP_CACHE_DIR="$(node -p 'require("os").tmpdir()')/vscode-ripgrep-cache-${RIPGREP_PACKAGE_VERSION}"
          RIPGREP_CACHE_PATH="${RIPGREP_CACHE_DIR}/${RIPGREP_ASSET}"
          mkdir -p "$RIPGREP_CACHE_DIR"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/microsoft/ripgrep-prebuilt/releases/download/${RIPGREP_VERSION}/${RIPGREP_ASSET}" \
            --output "$RIPGREP_CACHE_PATH"
          [[ "$(shasum -a 256 "$RIPGREP_CACHE_PATH" | awk '{print $1}')" == "$RIPGREP_SHA256" ]]
          tar -tzf "$RIPGREP_CACHE_PATH" >/dev/null
      - name: Install runtime source dependencies
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          bun install --frozen-lockfile
          npm --prefix .dependencies/code-server ci
      # CDXC:T3CodeDisabled ghostex-mzp9: Retain the pinned dependency setup for
      # a future re-enable; macOS packages intentionally omit T3 today.
      # - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      #   with: { node-version: 24.13.1 }
      # - name: Install pinned T3 Code dependencies
      #   env: { GITHUB_TOKEN: "${{ github.token }}" }
      #   run: |
      #     npm install --global pnpm@10.24.0
      #     pnpm --dir t3code install --frozen-lockfile
      - name: Import ephemeral Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ghostex-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - name: Build signed runtime prerequisite
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GHOSTEX_CODE_SIGN_IDENTITY: "Developer ID Application: Mohamad Youssef (KTKP595G3B)"
          GHOSTEX_ON_DEMAND_LINUX_ARM64_ARCHIVE: ${{ github.workspace }}/build/runtime-artifacts/arm64/gxserver-linux-arm64.tar.gz
          GHOSTEX_ON_DEMAND_LINUX_X64_ARCHIVE: ${{ github.workspace }}/build/runtime-artifacts/x64/gxserver-linux-x64.tar.gz
          GHOSTEX_CODE_SERVER_COMPONENT_VERSION: ${{ steps.code_server_identity.outputs.component_version }}
          GHOSTEX_ON_DEMAND_CODE_SERVER_LINUX_ARM64_ARCHIVE: ${{ github.workspace }}/build/runtime-artifacts/code-server-arm64/code-server-${{ steps.code_server_identity.outputs.component_version }}-linux-arm64.tar.gz
          GHOSTEX_ON_DEMAND_CODE_SERVER_LINUX_X64_ARCHIVE: ${{ github.workspace }}/build/runtime-artifacts/code-server-x64/${{ steps.code_server_identity.outputs.archive_name }}
          GHOSTEX_RELEASE_REPO_ROOT: ${{ github.workspace }}
          GHOSTEX_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          GHOSTEX_RELEASE_VERSION: ${{ inputs.version }}
          RUSTUP_TOOLCHAIN: 1.95.0
        run: .release-automation/scripts/release-gpui/macos-prerequisite.sh runtime "build/macos-prerequisites/runtime-${{ inputs.version }}-${{ inputs.source_sha }}.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.version }}-${{ inputs.source_sha }}-macos-runtime
          path: build/macos-prerequisites/runtime-${{ inputs.version }}-${{ inputs.source_sha }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  rust:
    if: ${{ inputs.macos_stage == 'all' || inputs.macos_stage == 'build-sign' }}
    needs: ghosttykit
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: "${{ inputs.source_sha }}", fetch-depth: 0, submodules: false }
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: main, path: .release-automation, fetch-depth: 1, submodules: false }
      - name: Verify immutable source
        run: |
          node .release-automation/scripts/release-resumable.mjs validate-source "${{ inputs.version }}" "${{ inputs.source_sha }}"
          echo "GHOSTEX_RELEASE_WORKFLOW_SHA=$(git -C .release-automation rev-parse HEAD)" >> "$GITHUB_ENV"
          printf '/.release-automation/\n' >> .git/info/exclude
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.version }}-${{ inputs.source_sha }}-macos-ghosttykit
          path: build/macos-prerequisites
      - name: Restore GhosttyKit and prepare Rust references
        env:
          GHOSTEX_RELEASE_REPO_ROOT: ${{ github.workspace }}
          GHOSTEX_RELEASE_SKIP_SUBMODULES: 1
        run: |
          tar -xf "build/macos-prerequisites/ghosttykit-${{ inputs.version }}-${{ inputs.source_sha }}.tar" -C "$GITHUB_WORKSPACE"
          .release-automation/scripts/release-gpui/prepare-references.sh
      - name: Install pinned Rust build toolchains
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          curl -fsSL https://mise.run | MISE_VERSION=2026.7.7 sh
          "$HOME/.local/bin/mise" use -g cmake@4.4.0 ninja@1.13.2
          "$HOME/.local/bin/mise" install zig@0.16.0
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          printf 'ZIG=%s\nGHOSTEX_ZIG=%s\n' \
            "$HOME/.local/share/mise/installs/zig/0.16.0/bin/zig" \
            "$HOME/.local/share/mise/installs/zig/0.16.0/bin/zig" >> "$GITHUB_ENV"
      - name: Build Rust prerequisite
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GHOSTEX_RELEASE_REPO_ROOT: ${{ github.workspace }}
          GHOSTEX_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          RUSTUP_TOOLCHAIN: 1.95.0
        run: .release-automation/scripts/release-gpui/macos-prerequisite.sh rust "build/macos-prerequisites/rust-${{ inputs.version }}-${{ inputs.source_sha }}.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.version }}-${{ inputs.source_sha }}-macos-rust
          path: build/macos-prerequisites/rust-${{ inputs.version }}-${{ inputs.source_sha }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build_sign:
    if: ${{ inputs.macos_stage == 'all' || inputs.macos_stage == 'build-sign' }}
    needs: [runtime, rust]
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: "${{ inputs.source_sha }}", fetch-depth: 0, submodules: false }
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: main, path: .release-automation, fetch-depth: 1, submodules: false }
      - name: Verify immutable source
        run: |
          node .release-automation/scripts/release-resumable.mjs validate-source "${{ inputs.version }}" "${{ inputs.source_sha }}"
          echo "GHOSTEX_RELEASE_WORKFLOW_SHA=$(git -C .release-automation rev-parse HEAD)" >> "$GITHUB_ENV"
          printf '/.release-automation/\n' >> .git/info/exclude
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.version }}-${{ inputs.source_sha }}-macos-runtime
          path: build/macos-prerequisites
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.version }}-${{ inputs.source_sha }}-macos-rust
          path: build/macos-prerequisites
      - name: Restore prepared runtime and Rust build
        run: |
          tar -xf "build/macos-prerequisites/runtime-${{ inputs.version }}-${{ inputs.source_sha }}.tar" -C "$GITHUB_WORKSPACE"
          tar -xf "build/macos-prerequisites/rust-${{ inputs.version }}-${{ inputs.source_sha }}.tar" -C "$GITHUB_WORKSPACE"
          mkdir -p build/remote-gxserver-linux/x64/package build/remote-gxserver-linux/arm64/package
          tar -xzf "build/on-demand-assets/${{ inputs.version }}/gxserver-linux-x64.tar.gz" -C build/remote-gxserver-linux/x64/package
          tar -xzf "build/on-demand-assets/${{ inputs.version }}/gxserver-linux-arm64.tar.gz" -C build/remote-gxserver-linux/arm64/package
          test -x build/remote-gxserver-linux/x64/package/bin/gxserver
          test -x build/remote-gxserver-linux/arm64/package/bin/gxserver
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.4.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.13.1 }
      - name: Install remaining assembly toolchains
        run: |
          brew install rsync
          rsync --version | head -n 1 | grep -F 'version 3.4.4'
          rustup toolchain install 1.95.0 --profile minimal
      - name: Install root assembly dependencies
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: bun install --frozen-lockfile
      - name: Import ephemeral Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ghostex-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - name: Build and sign without submitting to Apple
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GHOSTEX_CODE_SIGN_IDENTITY: "Developer ID Application: Mohamad Youssef (KTKP595G3B)"
          GHOSTEX_MACOS_RELEASE_STAGE: build-sign
          GHOSTEX_ON_DEMAND_LINUX_ARM64_ARCHIVE: ${{ github.workspace }}/build/on-demand-assets/${{ inputs.version }}/gxserver-linux-arm64.tar.gz
          GHOSTEX_ON_DEMAND_LINUX_X64_ARCHIVE: ${{ github.workspace }}/build/on-demand-assets/${{ inputs.version }}/gxserver-linux-x64.tar.gz
          GHOSTEX_GPUI_USE_PREBUILT_RUST: 1
          GHOSTEX_MACOS_SKIP_PREPARE_REFERENCES: 1
          GHOSTEX_MACOS_USE_PREPARED_RUNTIME: 1
          GHOSTEX_RELEASE_REPO_ROOT: ${{ github.workspace }}
          GHOSTEX_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          RUSTUP_TOOLCHAIN: 1.95.0
        run: .release-automation/scripts/release-gpui/macos.sh "${{ inputs.version }}" "${{ github.workspace }}/build/release-gpui/${{ inputs.version }}/macos-signed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.version }}-${{ inputs.source_sha }}-macos-signed
          path: build/release-gpui/${{ inputs.version }}/macos-signed/
          if-no-files-found: error
          retention-days: 90

  record_signed:
    if: ${{ inputs.macos_stage == 'all' || inputs.macos_stage == 'build-sign' }}
    needs: build_sign
    runs-on: macos-15
    concurrency: { group: "release-state-${{ inputs.version }}", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.13.1 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: "${{ inputs.version }}-${{ inputs.source_sha }}-macos-signed", path: build/macos-signed }
      - name: Record the preserved signed DMG
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          dmg_sha="$(shasum -a 256 "build/macos-signed/ghostex-${{ inputs.version }}-arm64.dmg" | awk '{print $1}')"
          node scripts/release-resumable.mjs record-macos-signed \
            "${{ inputs.version }}" \
            "${{ inputs.source_sha }}" \
            "$dmg_sha" \
            "${{ github.run_id }}" \
            "$(git rev-parse HEAD)" \
            "${{ inputs.channel }}" \
            "${{ inputs.update_sparkle }}"

  submit:
    if: ${{ always() && (inputs.macos_stage == 'all' || inputs.macos_stage == 'submit') && (needs.record_signed.result == 'success' || inputs.macos_stage == 'submit') }}
    needs: [build_sign, record_signed]
    runs-on: macos-15
    concurrency: { group: "release-state-${{ inputs.version }}", cancel-in-progress: false }
    outputs:
      submission_id: ${{ steps.submit.outputs.submission_id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.13.1 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.macos_stage == 'all' }}
        with: { name: "${{ inputs.version }}-${{ inputs.source_sha }}-macos-signed", path: build/macos-signed }
      - name: Download preserved signed package from prerequisite run
        if: ${{ inputs.macos_stage == 'submit' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh run download "${{ inputs.prerequisite_run_id }}" --repo maddada/Ghostex --name "${{ inputs.version }}-${{ inputs.source_sha }}-macos-signed" --dir build/macos-signed
      - name: Restore direct notarization key
        env: { NOTARY_KEY_BASE64: "${{ secrets.APPLE_NOTARY_KEY_BASE64 }}" }
        run: |
          if [[ -n "$NOTARY_KEY_BASE64" ]]; then
            printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey.p8"
            echo "GHOSTEX_NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
      - name: Submit without polling and persist the submission ID
        id: submit
        env:
          GH_TOKEN: ${{ github.token }}
          GHOSTEX_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          GHOSTEX_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          GHOSTEX_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          GHOSTEX_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          GHOSTEX_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          SIGNED_DMG_RUN_ID: ${{ inputs.macos_stage == 'all' && github.run_id || inputs.prerequisite_run_id }}
        run: |
          mkdir -p build/notary-submission
          expected_sha="$(node scripts/release-resumable.mjs show-state "${{ inputs.version }}" | jq -r .macos_notarization.dmg_sha256)"
          actual_sha="$(shasum -a 256 "build/macos-signed/ghostex-${{ inputs.version }}-arm64.dmg" | awk '{print $1}')"
          [[ "$actual_sha" == "$expected_sha" ]] || { echo "Preserved signed DMG checksum does not match release state" >&2; exit 1; }
          submission_id="$(scripts/release-gpui/macos-notary.sh submit "${{ inputs.version }}" "build/macos-signed/ghostex-${{ inputs.version }}-arm64.dmg" build/notary-submission/submission.json | tail -n 1)"
          echo "submission_id=$submission_id" >> "$GITHUB_OUTPUT"
          node scripts/release-resumable.mjs record-macos-submission "${{ inputs.version }}" "${{ inputs.source_sha }}" "$submission_id" "$actual_sha" "$SIGNED_DMG_RUN_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.version }}-${{ inputs.source_sha }}-macos-notary-submission
          path: build/notary-submission/submission.json
          if-no-files-found: error
          retention-days: 90

  poll_staple:
    if: ${{ always() && (inputs.macos_stage == 'all' || inputs.macos_stage == 'poll-staple') && (needs.submit.result == 'success' || inputs.macos_stage == 'poll-staple') }}
    needs: [build_sign, record_signed, submit]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: "${{ inputs.source_sha }}", fetch-depth: 0, submodules: false }
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: main, path: .release-automation, fetch-depth: 1, submodules: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.13.1 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.macos_stage == 'all' }}
        with: { name: "${{ inputs.version }}-${{ inputs.source_sha }}-macos-signed", path: build/macos-signed }
      - name: Download preserved signed package from prerequisite run
        if: ${{ inputs.macos_stage == 'poll-staple' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh run download "${{ inputs.prerequisite_run_id }}" --repo maddada/Ghostex --name "${{ inputs.version }}-${{ inputs.source_sha }}-macos-signed" --dir build/macos-signed
      - name: Restore direct notarization key
        env: { NOTARY_KEY_BASE64: "${{ secrets.APPLE_NOTARY_KEY_BASE64 }}" }
        run: |
          if [[ -n "$NOTARY_KEY_BASE64" ]]; then
            printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey.p8"
            echo "GHOSTEX_NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
      - name: Poll existing submission, staple, validate, and generate Sparkle metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GHOSTEX_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          GHOSTEX_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          GHOSTEX_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          GHOSTEX_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          GHOSTEX_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          GHOSTEX_RELEASE_REPO_ROOT: ${{ github.workspace }}
          GHOSTEX_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          GHOSTEX_RELEASE_UPDATE_SPARKLE: ${{ inputs.update_sparkle && '1' || '0' }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SUBMISSION_ID: ${{ inputs.macos_stage == 'all' && needs.submit.outputs.submission_id || inputs.submission_id }}
        run: |
          expected_sha="$(node .release-automation/scripts/release-resumable.mjs show-state "${{ inputs.version }}" | jq -r .macos_notarization.dmg_sha256)"
          actual_sha="$(shasum -a 256 "build/macos-signed/ghostex-${{ inputs.version }}-arm64.dmg" | awk '{print $1}')"
          [[ "$actual_sha" == "$expected_sha" ]] || { echo "Preserved signed DMG checksum does not match Apple submission state" >&2; exit 1; }
          .release-automation/scripts/release-gpui/macos-notary.sh poll "${{ inputs.version }}" "build/macos-signed/ghostex-${{ inputs.version }}-arm64.dmg" "$SUBMISSION_ID"
          .release-automation/scripts/release-gpui/macos-finalize.sh "${{ inputs.version }}" build/macos-signed "${{ github.workspace }}/build/release-gpui/${{ inputs.version }}/macos-arm64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.version }}-${{ inputs.source_sha }}-macos-final
          path: build/release-gpui/${{ inputs.version }}/macos-arm64/
          if-no-files-found: error
          retention-days: 90

  stage_final:
    needs: poll_staple
    if: ${{ always() && needs.poll_staple.result == 'success' }}
    runs-on: ubuntu-24.04
    concurrency: { group: "release-state-${{ inputs.version }}", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.13.1 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.version }}-${{ inputs.source_sha }}-macos-final
          path: build/macos-final
      - name: Stage final notarized assets and metadata
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node scripts/release-resumable.mjs stage-package-and-advance "${{ inputs.version }}" "${{ inputs.source_sha }}" macos-arm64 build/macos-final "$(git rev-parse HEAD)" "${{ inputs.channel }}" "${{ inputs.update_sparkle }}"
