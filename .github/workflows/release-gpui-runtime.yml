name: GPUI release - remote runtime

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      arch:
        required: true
        type: string
      include_windows_source_runtime:
        required: false
        default: false
        type: boolean
    outputs:
      code_server_component_version:
        value: ${{ jobs.build.outputs.code_server_component_version }}
      code_server_archive_name:
        value: ${{ jobs.build.outputs.code_server_archive_name }}
      code_server_artifact_name:
        value: ${{ jobs.build.outputs.code_server_artifact_name }}
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version
        required: true
        type: string
      arch:
        description: Linux runtime architecture
        required: true
        default: x64
        type: choice
        options: [x64, arm64]
      include_windows_source_runtime:
        description: Build the Linux Source runtime embedded by the Windows app
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.include_windows_source_runtime && 150 || 90 }}
    outputs:
      code_server_component_version: ${{ steps.code_server_identity.outputs.component_version }}
      code_server_archive_name: ${{ steps.code_server_identity.outputs.archive_name }}
      code_server_artifact_name: ${{ steps.code_server_identity.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: steveyegge/beads
          ref: 672d942083a1fd0c8603fa1e77620c58ba9d47c8
          fetch-depth: 1
          path: build/pinned-beads-source
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-go@v6
        with:
          go-version-file: build/pinned-beads-source/go.mod
          cache-dependency-path: build/pinned-beads-source/go.sum
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config
      - name: Install WSL Source build dependencies
        if: ${{ inputs.include_windows_source_runtime }}
        run: >-
          sudo apt-get install -y
          binutils
          build-essential
          jq
          libkrb5-dev
          libx11-dev
          libxkbfile-dev
          python3
          rsync
      - name: Install pinned Zig toolchains
        run: |
          curl https://mise.run | sh
          "$HOME/.local/bin/mise" install zig@0.15.2 zig@0.16.0
      - name: Install Rust musl targets
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Prepare source dependencies
        run: GHOSTEX_RELEASE_SKIP_GPUI_REFERENCES=1 scripts/release-gpui/prepare-references.sh
      - name: Resolve immutable code-server component identity
        if: ${{ inputs.include_windows_source_runtime }}
        id: code_server_identity
        run: node scripts/release-gpui/code-server-component-identity.mjs --root code-server --platform "linux-${{ inputs.arch }}" --github-output >> "$GITHUB_OUTPUT"
      - name: Build pinned embedded-Dolt Beads
        run: |
          node scripts/build-pinned-beads-release.mjs \
            --source-root build/pinned-beads-source \
            --platform linux \
            --arch "${{ inputs.arch }}" \
            --output "$RUNNER_TEMP/ghostex-pinned-beads/bd"
      - name: Build remote runtime
        env:
          GHOSTEX_BEADS_PREBUILT_BINARY: ${{ runner.temp }}/ghostex-pinned-beads/bd
          GHOSTEX_REQUIRE_BEADS_SMOKE: '1'
        run: |
          scripts/build-remote-gxserver-linux-release.sh --arch "${{ inputs.arch }}"
          OUTPUT="build/release-gpui/${{ inputs.version }}/gxserver-linux-${{ inputs.arch }}"
          mkdir -p "$OUTPUT"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "build/remote-gxserver-linux/${{ inputs.arch }}/package" \
            -czf "$OUTPUT/gxserver-linux-${{ inputs.arch }}.tar.gz" .
          source scripts/release-gpui/common.sh
          release_gpui_write_manifest \
            "$OUTPUT" \
            "gxserver-linux-${{ inputs.arch }}" \
            "${{ inputs.version }}" \
            "$OUTPUT/gxserver-linux-${{ inputs.arch }}.tar.gz"
      - name: Apply Ghostex code-server build patches
        if: ${{ inputs.include_windows_source_runtime }}
        run: |
          PATCH="$PWD/scripts/release-gpui/patches/code-server-ripgrep-target-validation.patch"
          git -C code-server apply --check "$PATCH"
          git -C code-server apply "$PATCH"
      - uses: actions/setup-node@v4
        if: ${{ inputs.include_windows_source_runtime }}
        with:
          node-version-file: code-server/.node-version
          cache: npm
          cache-dependency-path: |
            code-server/package-lock.json
            code-server/lib/vscode/package-lock.json
      - name: Build WSL Source runtime
        if: ${{ inputs.include_windows_source_runtime }}
        run: |
          npm --prefix code-server ci
          (
            cd code-server
            npm run build
            OS=linux \
              ARCH="${{ inputs.arch == 'arm64' && 'arm64' || 'amd64' }}" \
              VSCODE_TARGET="linux-${{ inputs.arch }}" \
              VERSION="$(node -p 'require("./package.json").version')" \
              npm run build:vscode
            KEEP_MODULES=1 \
              OS=linux \
              ARCH="${{ inputs.arch == 'arm64' && 'arm64' || 'amd64' }}" \
              VSCODE_TARGET="linux-${{ inputs.arch }}" \
              npm run release
          )
          require_file() {
            if [[ ! -f "$1" ]]; then
              echo "::error file=$1::The WSL Source runtime is missing required file $1"
              exit 1
            fi
          }
          require_executable() {
            if [[ ! -x "$1" ]]; then
              echo "::error file=$1::The WSL Source runtime is missing required executable $1"
              exit 1
            fi
          }
          require_executable code-server/release/lib/node
          require_file code-server/release/out/node/entry.js
          require_file code-server/release/out/node/routes/health.js
          require_file code-server/release/lib/vscode/out/server-main.js
          require_file code-server/release/lib/vscode/extensions/git/node_modules/@vscode/fs-copyfile/package.json
          require_executable code-server/release/lib/vscode/node_modules/@vscode/ripgrep/bin/rg
          require_file code-server/release/lib/vscode/node_modules/node-pty/build/Release/pty.node
          grep -F promptEditorIpcReady code-server/release/out/node/routes/health.js >/dev/null
          code-server/release/lib/node code-server/release/out/node/entry.js --version >/dev/null
      # CDXC:T3CodeDisabled ghostex-mzp9: The setup-node and Build WSL T3 Code
      # runtime steps stay in history for a future re-enable; packaging is
      # intentionally disabled on every platform while the feature flag is off.
      # - uses: actions/setup-node@v4
      #   if: ${{ inputs.include_windows_source_runtime }}
      #   with:
      #     node-version: 24.13.1
      # - name: Build WSL T3 Code runtime
      #   if: ${{ inputs.include_windows_source_runtime }}
      #   env:
      #     GITHUB_TOKEN: ${{ github.token }}
      #   run: |
      #     npm install --global pnpm@10.24.0
      #     pnpm --dir t3code install --frozen-lockfile
      #     VSMUX_T3CODE_REPO_ROOT="$PWD/t3code" ghostex_T3CODE_REPO_ROOT="$PWD/t3code" bun scripts/build-t3code-if-needed.mjs
      #     TARGET="$PWD/code-server/release/t3code-server"
      #     rm -rf "$TARGET"
      #     mkdir -p "$TARGET/lib"
      #     cp -R t3code/apps/server/dist "$TARGET/dist"
      #     cp "$(command -v node)" "$TARGET/lib/node"
      #     chmod 755 "$TARGET/lib/node"
      #     node scripts/package-t3code-server.mjs --source-root "$PWD/t3code" --target "$TARGET"
      #     (cd "$TARGET" && npm --userconfig=/dev/null install --omit=dev --no-audit --no-fund)
      #     find "$TARGET" -type f -name '*.map' -delete
      #     test -x "$TARGET/lib/node"
      #     test -f "$TARGET/dist/bin.mjs"
      #     "$TARGET/lib/node" "$TARGET/dist/bin.mjs" --help >/dev/null
      - name: Package WSL Source runtime
        if: ${{ inputs.include_windows_source_runtime }}
        run: |
          OUTPUT="build/release-gpui/${{ inputs.version }}/code-server-linux-${{ inputs.arch }}"
          ARCHIVE="$OUTPUT/${{ steps.code_server_identity.outputs.archive_name }}"
          mkdir -p "$OUTPUT"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C code-server/release \
            -czf "$ARCHIVE" .
          archive_sha256="$(sha256sum "$ARCHIVE" | awk '{ print $1 }')"
          printf '%s  %s\n' "$archive_sha256" "$(basename "$ARCHIVE")" >"$ARCHIVE.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: release-gxserver-linux-${{ inputs.arch }}
          path: build/release-gpui/${{ inputs.version }}/gxserver-linux-${{ inputs.arch }}/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.include_windows_source_runtime }}
        with:
          name: ${{ steps.code_server_identity.outputs.artifact_name }}
          path: build/release-gpui/${{ inputs.version }}/code-server-linux-${{ inputs.arch }}/
          if-no-files-found: error
          retention-days: 14
