# CDXC:RepoStructure 2026-06-27-12:06: GPUI app tests are intentionally absent while product behavior is still moving. Lock GPUI behavior down with tests later, and keep test suites for other Ghostex projects intact.
# CDXC:RepoStructure 2026-06-28-15:12: GPUI source should not retain test-only scaffolding while the project policy excludes GPUI tests. Keep behavioral notes in production comments and verify cleanup with compile/check paths instead of hidden #[cfg(test)] helpers.
[package]
name = "ghostex-gpui"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "ghostex-gpui"
path = "src/main.rs"

[[bin]]
name = "ghostex-gpui-cef-helper"
path = "src/bin/ghostex_gpui_cef_helper.rs"

[[bin]]
name = "ghostex-gpui-cef-bootstrap"
path = "src/bin/ghostex_gpui_cef_bootstrap.rs"

[[bin]]
name = "ghostex-windows-installer"
path = "src/bin/ghostex_windows_installer.rs"

# Release packaging of the Windows installer (tooling/release-gpui/windows.ps1).
[[bin]]
name = "ghostex-windows-installer-pack"
path = "src/bin/ghostex_windows_installer_pack.rs"

# CDXC:Terminal 2026-07-03: smoke/demo walkthrough for the libghostty-vt wrapper (see src/bin/ghostty_vt_smoke.rs), a deliverable demo path rather than a test harness.
[[bin]]
name = "ghostty-vt-smoke"
path = "src/bin/ghostty_vt_smoke.rs"

# CDXC:Terminal 2026-07-03: smoke/demo walkthrough for the PTY → vt → snapshot model (see src/bin/terminal_model_smoke.rs), a deliverable demo path rather than a test harness.
[[bin]]
name = "terminal-model-smoke"
path = "src/bin/terminal_model_smoke.rs"

# CDXC:Terminal 2026-07-03: TEMPORARY windowed demo for the P1c GPUI-composited terminal element (see src/bin/terminal_element_demo.rs); delete once P1e integrates the element into real panes.
[[bin]]
name = "terminal-element-demo"
path = "src/bin/terminal_element_demo.rs"

# CDXC:AppModal 2026-09-15: standalone preview of the native GPUI app modals (see src/bin/native_modal_demo.rs) so their look can be checked against the React stories without launching Ghostex.
[[bin]]
name = "native-modal-demo"
path = "src/bin/native_modal_demo.rs"

# CDXC:Docs 2026-09-28 WHY: standalone preview of the native Files view's Markdown document (see src/bin/native_docs_demo.rs) so its look can be compared with the React Files page without launching Ghostex.
[[bin]]
name = "native-docs-demo"
path = "src/bin/native_docs_demo.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4.45"
# CDXC:CefRuntime 2026-10-25 WHY: keep the cef-rs gitlink at 154.3.0+154.0.32 or newer (every CEF 156 build qualifies: its 8078 branch carries the fix as e048aa005). Earlier CEF 154 builds (chromiumembedded/cef#4285, fixed by 4f8a5688b) CHECK-crash in TabStripModel::IsTabSelected whenever Chromium opens a new tab its own way, a DevTools Target.createTarget or the "+" button in a Chromium-drawn tab strip, and the whole app quits (GitHub #302).
cef = { path = "../../.dependencies/cef-rs/cef", default-features = false }
flate2 = "1"
futures = "0.3"
ghostex-paths = { path = "../../packages/paths" }
ghostex-gx-protocol = { path = "../../packages/gx-protocol" }
ghostex-client-storage = { path = "../../packages/client-storage-native" }
ghostex-gx-chat-core = { path = "../../packages/gx-chat-core" }
ghostex-gx-chat-client = { path = "../../packages/gx-chat-client" }
ghostex-gx-client = { path = "../../packages/gx-client" }
ghostex-gx-core = { path = "../../packages/gx-core" }
ghostex-settings-catalog = { path = "../../packages/settings-catalog" }
ghostex-agent-sync = { path = "../../packages/agent-sync" }
ghostex-docs = { path = "../../packages/project-docs" }
# CDXC:Docs 2026-09-24 DECISION: User: build native Docs on zorite-editor, the MIT crate from packetThrower/zorite ("you can look at the gpl code but dont copy it verbatim"). The live-preview editor, math (RaTeX) and Mermaid (mermaid-rs-renderer, rasterized by resvg) are the prototype the user reviewed ("ok this looks AWESOME ... let's keep going this way").
zorite-editor = { path = "../../.dependencies/zorite/zorite-editor" }
ratex-gpui = { path = "../../.dependencies/zorite/ratex-gpui" }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
similar = "3"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
# CDXC:SessionChat 2026-09-18 WHY: every tree-sitter grammar in gpui-component sits behind an off-by-default feature, and `TextView` silently renders an unhighlighted fence when the language cannot be resolved. Without this the native transcript shows plain grey code while the React one colours the same fence through Shiki, so the feature list is part of chat parity, not an optional extra.
gpui-component = { path = "../../.dependencies/gpui-component/crates/component", features = ["tree-sitter-languages"] }
gpui-component-assets = { package = "gpui-kit-assets", path = "../../.dependencies/gpui-component/crates/assets" }
# CDXC:Settings 2026-09-28 WHY: the native Settings slider is drawn on GPUI-Kit's unstyled slider primitives (`gpui_base::{Slider, SliderTrack, SliderIndicator, SliderThumb}`); `gpui_component::slider::Slider` fixes a 6px track tinted from the bar colour, which cannot match the React 4px track. gpui-base was already in the graph through gpui-component.
gpui-base = { path = "../../.dependencies/gpui-component/crates/base" }
# CDXC:Docs 2026-10-17 DECISION: User (Q219): CSV and TSV files open in the Files view as a "native table" (read-only, with a Raw switch); `csv` reads them. User (Q221): "mapping and top grammars": Dockerfile, PowerShell and Terraform/HCL get real grammars (MIT, MIT, Apache-2.0), registered with the editor's highlighter by `native_docs/grammars.rs`; `tree-sitter` is the version gpui-component already links.
csv = "1"
tree-sitter = "0.26"
tree-sitter-containerfile = "0.9"
tree-sitter-hcl = "1.1"
tree-sitter-powershell = "0.26"
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg", "gif", "bmp", "tiff"] }
# CDXC:SessionTitles 2026-09-15 WHY: the native Rename Session dialog ports `normalizeSessionRenameTitle` (NFKC + a Unicode-class glyph filter); both crates were already in the graph through gpui and url, so this is a direct-dependency promotion, not a new download.
icu_normalizer = "2"
libc = "0.2"
log = "0.4"
portable-pty = "0.9"
# CDXC:RemotePairing 2026-09-15: the native Remote Setup dialog draws the Android install QR code itself (src/app/window/remote_setup_modal.rs); no image or svg render features, the modules are painted as gpui squares.
qrcode = { version = "0.14", default-features = false }
percent-encoding = "2"
raw-window-handle = "0.6"
regex = "1"
rust-embed = { version = "8.7.2", features = ["include-exclude"] }
# CDXC:Terminal 2026-10-22 WHY: unpacks the terminal font faces that build.rs packs into one zstd frame (see register_gpui_terminal_engine_fonts). Pure Rust, so every target builds it with plain cargo; decoding only, without the checksum feature (the frame carries no checksum).
ruzstd = { version = "0.9", default-features = false }
serde_json = "1"
# `rc` makes `Arc<Value>` deserializable, which the sidebar snapshot needs: a group's menu and
# its header buttons are the two heavy fields of a list that is cloned per patch and per install.
serde = { version = "1", features = ["derive", "rc"] }
rusqlite = "0.40"
# CDXC:Browser 2026-10-22 WHY: the remote sites menu reads a page's `<title>` and icon link with the html5ever and RcDom versions gpui-component's base crate already links. `scraper` did this before and brought a second html5ever copy into the binary; keep these two on gpui-base's versions so no new copy appears.
html5ever = "0.27"
markup5ever_rcdom = "0.3"
sha2 = "0.11"
hex = "0.4"
# CDXC:Release 2026-10-28 WHY: the AppImage updater checks the release signature (RSA/SHA-256, src/appimage_signature.rs) with the ring version rustls already links through ureq, so this is a direct-dependency promotion, not a new download.
ring = "0.17"
tar = "0.4"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ureq = { version = "3.3.0", default-features = false, features = ["platform-verifier", "rustls"] }
# CDXC:AddProject 2026-09-28 WHY: the native Add Project dialog ports `parseAddProjectCloneInput`, which normalizes pasted clone URLs with the WHATWG `URL` parser. The `url` crate implements that same standard and was already in the graph through ureq and gpui, so this is a direct-dependency promotion, not a new download.
url = "2"
# CDXC:SessionChat 2026-09-22 WHY: the Rust chat host mints the draft ids and the chat client id the brain must not generate itself (the core reads no random source), in the same v4 shape `crypto.randomUUID()` produces. Already in the graph through the desktop crate's other dependencies.
uuid = { version = "1", features = ["v4"] }
# CDXC:WebGpui 2026-09-22 WHY: `std::time::Instant::now()` panics on wasm32, and apps/gpui-web compiles the drawing files of this crate for the browser. `web_time::Instant` IS `std::time::Instant` on every native target (a re-export, already in the graph through gpui), so files shared with the web build name it instead.
web-time = "1"
instant = "0.1"

# CDXC:CefRuntime 2026-07-04: the Linux CEF adapter (src/cef/linux_x11.rs)
# positions/maps/focuses CEF child X11 windows through x11rb, pinned to the same
# major as gpui's own X11 backend dependency so both speak the protocol from one
# crate lineage; x11rb needs no libX11/libxcb at link time.
# CDXC:Notifications 2026-10-20 WHY: completion and copy sounds play in-process on Linux and Windows (app/helpers/os_cli/native_event_queue.rs; macOS uses afplay). rodio 0.23 plays through cpal 0.18; on Linux it needs the ALSA headers (libasound2-dev), which the release and remote-build Linux jobs already install, and libasound2/alsa-lib, which every Linux package already declares. Only the MP3 decoder is enabled.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-mp3"] }
# CDXC:VoiceMode 2026-10-20 WHY: the voice conversation and Dictate on Windows and Linux (app/voice_agent/audio_cpal.rs) capture and play through the same cpal 0.18 rodio sits on, and cancel the agent's echo with Sonora, a pure-Rust port of WebRTC's audio processing (AEC3, noise suppression; BSD-3-Clause, about 0.5 MB, plain cargo build on every target). The system cancellers were rejected: Windows' communications mode depends on the driver, PipeWire's echo-cancel module needs the user to load it, and the C++ WebRTC builds need meson or a prebuilt download. Sonora is young, so it is pinned exactly; bump it on purpose and re-run the voice audio lab (docs/2026-10-20/voice-mode/windows-linux-phase1.md).
cpal = "0.18"
sonora = "=0.2.0"
sonora-common-audio = "=0.2.0"

# macOS links the system SQLite: CDXC:Release 2026-10-23 DECISION in server/Cargo.toml.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xinput"] }
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }

# CDXC:CefRuntime 2026-07-04: the Windows CEF adapter (src/cef/windows.rs)
# drives a message-only pump HWND and child-HWND frame/visibility/focus through
# windows-sys, pinned to the same major as the cef crate's own Windows dependency.
[target.'cfg(target_os = "windows")'.dependencies]
ghostex-editor-client = { path = "../../packages/editor-client" }
# The installer's LZMA payload (src/bin/ghostex_windows_installer.rs unpacks it, ghostex_windows_installer_pack.rs writes it); `static` builds the bundled C source, so no system xz or libclang is needed.
liblzma = { version = "0.4", default-features = false, features = ["static", "parallel"] }
# The same zip version Velopack reads its Setup.exe package with (ghostex_windows_installer_pack.rs stores that package uncompressed).
zip = { version = "8", default-features = false, features = ["deflate"] }
sysinfo = "0.39"
velopack = { version = "1.2.0", features = ["public-utils"] }
# CDXC:Onboarding 2026-10-01 WHY: WebView2 for the first-run intro video only (window/onboarding/intro_web_view.rs; macOS uses its own WKWebView shim). The version the GhostexEditor helper already ships (apps/editor/desktop); without default features it pulls no GTK or X11 crates.
wry = { version = "0.57", default-features = false }
# CDXC:Notifications 2026-10-05 WHY: Windows toasts (app/helpers/os_cli/windows_notifications.rs) are WinRT. The same major WebView2 already builds through wry, so this adds features, not a second copy.
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security_Cryptography",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    # ConnectNamedPipe takes an OVERLAPPED: a running Ghostex's session link pipe (windows_single_instance.rs).
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    # The attach control pipe of a Windows terminal viewer (terminal_model/zmx_control.rs).
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    # The native Settings colour swatch opens the system colour dialog (ChooseColorW), as the React `<input type="color">` did through CEF.
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    # A web page's app link (Okta Verify, Zoom) names the app that opens it (AssocQueryStringW, app/browser_site_requests.rs).
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
# Packs the terminal font faces into one frame at build time (build.rs); none of it ships in the app.
zstd = { version = "0.14", default-features = false }

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "../../.dependencies/zed/crates/gpui" }
gpui_macros = { path = "../../.dependencies/zed/crates/gpui_macros" }
gpui_platform = { path = "../../.dependencies/zed/crates/gpui_platform" }
gpui_shared_string = { path = "../../.dependencies/zed/crates/gpui_shared_string" }
gpui_util = { path = "../../.dependencies/zed/crates/gpui_util" }
sum_tree = { path = "../../.dependencies/zed/crates/sum_tree" }

[patch.crates-io]
blob-decoder = { path = "../../.dependencies/blob-decoder" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

# Native regression probe: a real Metal window, no effect textures allocated.
[[test]]
name = "shader-canvas"
path = "tests/shader_canvas.rs"
harness = false
test = false
required-features = ["shader-canvas-probe"]

[features]
shader-canvas-probe = ["gpui/test-support"]
