# CDXC:GPUITestingPolicy 2026-06-27-12:06: GPUI app tests are intentionally absent while product behavior is still moving. Lock GPUI behavior down with tests later, and keep test suites for other Ghostex projects intact.
# CDXC:GPUITestingPolicy 2026-06-28-15:12: GPUI source should not retain test-only scaffolding while the project policy excludes GPUI tests. Keep behavioral notes in production comments and verify cleanup with compile/check paths instead of hidden #[cfg(test)] helpers.
[package]
name = "ghostex-gpui"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "ghostex-gpui"
path = "src/main.rs"

[[bin]]
name = "ghostex-gpui-cef-helper"
path = "src/bin/ghostex_gpui_cef_helper.rs"

[[bin]]
name = "ghostex-gpui-cef-bootstrap"
path = "src/bin/ghostex_gpui_cef_bootstrap.rs"

[[bin]]
name = "ghostex-windows-installer"
path = "src/bin/ghostex_windows_installer.rs"

# CDXC:GPUILibghosttyVt 2026-07-03: smoke/demo walkthrough for the libghostty-vt wrapper (see src/bin/ghostty_vt_smoke.rs), a deliverable demo path rather than a test harness.
[[bin]]
name = "ghostty-vt-smoke"
path = "src/bin/ghostty_vt_smoke.rs"

# CDXC:GPUITerminalModel 2026-07-03: smoke/demo walkthrough for the PTY → vt → snapshot model (see src/bin/terminal_model_smoke.rs), a deliverable demo path rather than a test harness.
[[bin]]
name = "terminal-model-smoke"
path = "src/bin/terminal_model_smoke.rs"

# CDXC:GPUITerminalElement 2026-07-03: TEMPORARY windowed demo for the P1c GPUI-composited terminal element (see src/bin/terminal_element_demo.rs); delete once P1e integrates the element into real panes.
[[bin]]
name = "terminal-element-demo"
path = "src/bin/terminal_element_demo.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
cef = { path = "../../.dependencies/cef-rs/cef", default-features = false }
flate2 = "1"
futures = "0.3"
ghostex-paths = { path = "../../packages/paths" }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { path = "../../.dependencies/gpui-component/crates/ui" }
gpui-component-assets = { path = "../../.dependencies/gpui-component/crates/assets" }
image = { version = "0.25", default-features = false, features = ["png"] }
portable-pty = "0.9"
percent-encoding = "2"
raw-window-handle = "0.6"
rust-embed = { version = "8.7.2", features = ["include-exclude"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"

# CDXC:GPUICefPlatformSeam 2026-07-04: the Linux CEF adapter (src/cef/linux_x11.rs)
# positions/maps/focuses CEF child X11 windows through x11rb, pinned to the same
# major as gpui's own X11 backend dependency so both speak the protocol from one
# crate lineage; x11rb needs no libX11/libxcb at link time.
[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "3.3.0", default-features = false, features = ["platform-verifier", "rustls"] }
x11rb = "0.13"

# CDXC:GPUICefPlatformSeam 2026-07-04: the Windows CEF adapter (src/cef/windows.rs)
# drives a message-only pump HWND and child-HWND frame/visibility/focus through
# windows-sys, pinned to the same major as the cef crate's own Windows dependency.
[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = "0.31.4"
velopack = { version = "1.2.0", features = ["public-utils"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "../../.dependencies/zed/crates/gpui" }
gpui_macros = { path = "../../.dependencies/zed/crates/gpui_macros" }
gpui_platform = { path = "../../.dependencies/zed/crates/gpui_platform" }
gpui_shared_string = { path = "../../.dependencies/zed/crates/gpui_shared_string" }
gpui_util = { path = "../../.dependencies/zed/crates/gpui_util" }

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
