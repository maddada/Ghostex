<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghostex App Modal Host</title>
    <!-- CDXC:AppModal 2026-09-14 WHY: Native windows must carry their appearance into the first HTML paint; waiting for React hydration flashes dark when opening Quick Access or Settings in light mode. -->
    <script>
      document.documentElement.dataset.appAppearance =
        new URLSearchParams(location.search).get('appAppearance') === 'light' ? 'light' : 'dark';
      if (new URLSearchParams(location.search).get('windowGlass') === '1') {
        document.documentElement.dataset.windowGlass = 'true';
      }
    </script>
    <style>
      html,
      body {
        background: #0e0e0e;
        margin: 0;
      }
      html[data-app-appearance='light'] {
        --app-modal-background: #ffffff;
        color-scheme: light;
      }
      html[data-app-appearance='light'],
      html[data-app-appearance='light'] body {
        background: #ffffff;
      }
      /* The lighter glass window colour (styles/modals-glass.css) from the first paint. */
      html[data-window-glass='true'][data-app-appearance='dark'],
      html[data-window-glass='true'][data-app-appearance='dark'] body {
        background: #2b2b2b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!--
      CDXC:AppModal 2026-06-24-11:09:
      GPUI app-modal windows reuse the production React modal host from native/sidebar/modal-host.tsx. Keep this entry as a thin CEF HTML wrapper so Settings, Hotkeys, and Command Palette do not grow GPUI-only placeholder or duplicate modal UI.
    -->
    <script type="module" src="./views/modal-host.tsx"></script>
  </body>
</html>
