[package]
name = "ghostex-history"
version = "0.1.0"
edition = "2021"
description = "Alt-screen terminal history viewer for local agent transcripts"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.29"
ratatui = "0.30"
serde_json = "1"
textwrap = "0.16"
unicode-width = "0.2"
