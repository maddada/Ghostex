[package]
name = "ghostex-editor"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "ghostex-editor"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
ctrlc = "3.5"
interprocess = "2.4"
mime_guess = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
wry = "0.57"

[target.'cfg(windows)'.dependencies]
ghostex-paths = { path = "../../../packages/paths" }
ghostex-editor-client = { path = "../../../packages/editor-client" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
