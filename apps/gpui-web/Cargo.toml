[package]
name = "ghostex-gpui-web"
version = "0.1.0"
edition = "2024"
publish = false

# CDXC:WebGpui 2026-09-22 WHY: the browser build is its own crate because `ghostex-gpui` is binary-only and links CEF, libghostty, PTYs and SQLite (and QuickJS until 2026-09-25), none of which exist on wasm32. This crate compiles the desktop's drawing code straight from `apps/desktop/src` (symlinks under `src/`, plus the items `build.rs` lifts out of mixed files) and feeds it from the platform-neutral cores, so the desktop crate does not change shape for an experiment.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
gpui-component = { path = "../../.dependencies/gpui-component/crates/component", default-features = false }
gpui-component-assets = { path = "component-assets" }
rust-embed = { version = "8.7.2", features = ["debug-embed", "include-exclude"] }
ghostex-gx-core = { path = "../../packages/gx-core" }
ghostex-gx-protocol = { path = "../../packages/gx-protocol" }
ghostex-gx-chat-core = { path = "../../packages/gx-chat-core" }
ghostex-gx-chat-client = { path = "../../packages/gx-chat-client" }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "wasmbind"] }
icu_normalizer = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
futures = "0.3"
web-time = "1"
instant = { version = "0.1", features = ["wasm-bindgen"] }
log = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "Headers",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Storage",
    "WebSocket",
    "XmlHttpRequest",
    "HtmlIFrameElement",
    "Document",
    "Element",
    "HtmlElement",
    "CssStyleDeclaration",
    "Crypto",
    "Window",
] }

# Same redirects as apps/desktop so both apps build one gpui, plus the web-only crates the desktop never needs.
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "../../.dependencies/zed/crates/gpui" }
gpui_macros = { path = "../../.dependencies/zed/crates/gpui_macros" }
gpui_platform = { path = "../../.dependencies/zed/crates/gpui_platform" }
gpui_shared_string = { path = "../../.dependencies/zed/crates/gpui_shared_string" }
gpui_util = { path = "../../.dependencies/zed/crates/gpui_util" }
gpui_web = { path = "../../.dependencies/zed/crates/gpui_web" }
gpui_wgpu = { path = "../../.dependencies/zed/crates/gpui_wgpu" }
sum_tree = { path = "../../.dependencies/zed/crates/sum_tree" }

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

[profile.release]
opt-level = 2
debug-assertions = false

# CDXC:WebGpui 2026-09-22 WHY: gpui's `shape_line` debug-asserts that its text has no newline, and the shared chat code passes it lines that can carry one (the release desktop app never sees the assert). A panic in wasm aborts the whole page, so debug assertions are off; for every crate at once, because gpui and gpui-component both gate their inspector on the flag and must agree. gpui is also optimized in dev builds: an unoptimized text and layout engine is too slow to judge the experiment by.
[profile.dev]
debug-assertions = false

[profile.dev.package.gpui]
opt-level = 2

[profile.dev.package.gpui_wgpu]
opt-level = 2
